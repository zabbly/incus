name: Builds
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-incus:
    name: Build Incus
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        arch:
          - amd64
          - arm64
    runs-on:
      - self-hosted
      - zabbly-incus-build
      - arch-${{ matrix.arch }}
      - image-${{ matrix.os }}

    env:
      OS_ARCH: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os }}
      PKG_CONFIG_PATH: "/opt/incus/lib/pkgconfig/"
      CGO_LDFLAGS: "-L/opt/incus/lib/"
      CGO_CFLAGS: "-I/opt/incus/include/"
      LD_LIBRARY_PATH: "/opt/incus/lib/"
      CPATH: "/opt/incus/include/"
      PATH: "/home/runner/.cargo/bin:/home/runner/.local/bin:/opt/incus/bin:/usr/local/go/bin:/usr/local/node/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin"

      # Linux Containers projects
      DISTROBUILDER_TAG: "distrobuilder-3.2"
      INCUS_COMPOSE_TAG: "v1.4.2"
      INCUS_TAG: "v7.0.2"
      INCUS_UI_CANONICAL_TAG: "incus-0.23.1.0"
      LXCFS_TAG: "v7.0.0"
      LXC_TAG: "v7.0.0"

      # External dependencies
      COWSQL_TAG: "v1.15.9"
      CRIU_TAG: "v4.3.1"
      EDK2_TAG: "edk2-stable202611"
      GOLANG_TAG: "go1.27.4"
      LEGO_TAG: "v4.35.2"
      LIBTPMS_TAG: "v0.10.2"
      LIBURING_TAG: "liburing-2.15"
      NASM_TAG: "nasm-2.16.03"
      NVIDIA_CONTAINER_TAG: "v1.20.2"
      QEMU_TAG: "v11.1.3"
      RAFT_TAG: "v0.22.1"
      SEABIOS_TAG: "rel-1.17.0"
      SKOPEO_TAG: "v1.25.2"
      SWTPM_TAG: "v0.10.2"
      TRUENAS_INCUS_CTL_TAG: "v0.7.7"
      VIRGLRENDERER_TAG: "1.3.0"
      VIRTIOFSD_TAG: "v1.15.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global --add advice.detachedHead false
          git config --global user.email "noreply@zabbly.com"
          git config --global user.name "Zabbly Incus build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            acpica-tools \
            asciidoc \
            autoconf \
            automake \
            bison \
            bmake \
            build-essential \
            curl \
            debhelper \
            devscripts \
            dosfstools \
            expect \
            flex \
            gawk \
            gettext \
            gnutls-bin \
            gnutls-dev \
            git \
            iproute2 \
            libacl1-dev \
            libaio-dev \
            libapparmor-dev \
            libbtrfs-dev \
            libcap-dev \
            libcap-ng-dev \
            libdbus-1-dev \
            libdevmapper-dev \
            libelf-dev \
            libfuse3-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            libgpgme-dev \
            libjson-glib-dev \
            libnet1-dev \
            libnl-3-dev \
            libnuma-dev \
            libpam0g-dev \
            libpixman-1-dev \
            libpng-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            librbd-dev \
            libseccomp-dev \
            libselinux1-dev \
            libspice-server-dev \
            libsqlite3-dev \
            libssl-dev \
            libsystemd-dev \
            libtirpc-dev \
            libtool \
            libudev-dev \
            libusb-1.0-0-dev \
            libusbredirhost-dev \
            libuv1-dev \
            lsb-release \
            mtools \
            ninja-build \
            pipx \
            pkg-config \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-cryptography \
            python3-jinja2 \
            python3-pexpect \
            python3-pip \
            python3-setuptools \
            python3-tomli \
            python3-venv \
            rsync \
            socat \
            uuid-dev \
            xmlto \
            xorriso

          if [ "${OS_NAME}" = "debian-13" ] || [ "${OS_NAME}" = "ubuntu-26.04" ]; then
            sudo apt-get install --no-install-recommends --yes \
                libdrm-dev \
                libegl1-mesa-dev \
                libgbm-dev \
                libepoxy-dev
          fi

          sudo apt-get install --no-install-recommends --yes systemd-dev || true

          pipx install meson

      - name: Install Go
        run: |
          curl -sL "https://go.dev/dl/${GOLANG_TAG}.linux-${OS_ARCH}.tar.gz" | sudo tar -C /usr/local/ -zx
          go version

      - name: Install Rust
        run: |
          curl -sL https://sh.rustup.rs -o install-rust.sh
          bash install-rust.sh -y

      - name: Install Node
        run: |
          [ "${OS_ARCH}" = "amd64" ] && NODE_ARCH=x64
          [ "${OS_ARCH}" = "arm64" ] && NODE_ARCH=arm64


          sudo mkdir /usr/local/node/
          curl -sL "https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-${NODE_ARCH}.tar.xz" | sudo tar -C /usr/local/node/ -Jx --strip-components=1

      - name: Build environment
        run: |
          sudo mkdir -p /build/ /opt/
          sudo chown $(id -u):$(id -g) /build/ /opt/

          mkdir -p \
            /opt/incus/bin/ \
            /opt/incus/include/ \
            /opt/incus/lib/ \
            /opt/incus/lib/systemd \
            /opt/incus/share/

      - name: Get the code
        run: |
          PIDS=""
          bg() {
              "$@" &
              PIDS="${PIDS} $!"
          }

          bg git clone https://github.com/lxc/distrobuilder /build/distrobuilder --depth 1 -b "${DISTROBUILDER_TAG}"
          bg git clone https://github.com/lxc/lxc /build/lxc -b "${LXC_TAG}"
          bg git clone https://github.com/lxc/lxcfs /build/lxcfs --depth 1 -b "${LXCFS_TAG}"
          bg git clone https://github.com/lxc/incus /build/incus -b "${INCUS_TAG}"
          bg git clone https://github.com/lxc/incus-compose /build/incus-compose --depth 1 -b "${INCUS_COMPOSE_TAG}"
          bg git clone https://github.com/zabbly/incus-ui-canonical /build/incus-ui-canonical --depth 1 -b "${INCUS_UI_CANONICAL_TAG}"

          bg git clone https://github.com/axboe/liburing /build/liburing --depth 1 -b "${LIBURING_TAG}"
          bg git clone https://github.com/checkpoint-restore/criu /build/criu --depth 1 -b "${CRIU_TAG}"
          bg git clone https://github.com/containers/skopeo /build/skopeo --depth 1 -b "${SKOPEO_TAG}"
          bg git clone https://github.com/cowsql/cowsql /build/cowsql --depth 1 -b "${COWSQL_TAG}"
          bg git clone https://github.com/cowsql/raft /build/raft --depth 1 -b "${RAFT_TAG}"
          bg git clone https://github.com/go-acme/lego /build/lego --depth 1 -b "${LEGO_TAG}"
          bg git clone https://github.com/NVIDIA/libnvidia-container /build/libnvidia-container --depth 1 -b "${NVIDIA_CONTAINER_TAG}"
          bg git clone https://github.com/stefanberger/libtpms /build/libtpms --depth 1 -b "${LIBTPMS_TAG}"
          bg git clone https://github.com/stefanberger/swtpm /build/swtpm --depth 1 -b "${SWTPM_TAG}"
          bg git clone https://github.com/tianocore/edk2 /build/edk2 --recurse-submodules --shallow-submodules --depth 1 -b "${EDK2_TAG}"
          bg git clone https://github.com/truenas/truenas_incus_ctl /build/truenas_incus_ctl --depth 1 -b "${TRUENAS_INCUS_CTL_TAG}"
          bg git clone https://gitlab.com/qemu-project/qemu /build/qemu --depth 1 -b "${QEMU_TAG}"
          bg git clone https://gitlab.com/qemu-project/seabios /build/seabios --depth 1 -b "${SEABIOS_TAG}"
          bg git clone https://gitlab.com/virtio-fs/virtiofsd /build/virtiofsd --depth 1 -b "${VIRTIOFSD_TAG}"

          if [ "${OS_NAME}" = "debian-13" ] || [ "${OS_NAME}" = "ubuntu-26.04" ]; then
            bg git clone https://gitlab.freedesktop.org/virgl/virglrenderer /build/virglrenderer --depth 1 -b "${VIRGLRENDERER_TAG}"
          fi

          mkdir /build/nasm/
          curl -sL "https://www.nasm.us/pub/nasm/releasebuilds/$(echo ${NASM_TAG} | cut -d- -f2)/${NASM_TAG}.tar.gz" --resolve www.nasm.us:443:198.137.202.136 | tar -C /build/nasm/ -zx --strip-components=1 &
          PIDS="${PIDS} $!"

          for pid in ${PIDS}; do
              wait "${pid}"
          done

      - name: Build liburing
        run: |
          cd /build/liburing
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/liburing/
          DESTDIR=/build/target/liburing make install
          rsync -a /build/target/liburing/opt/incus/include/* /opt/incus/include/
          rsync -a /build/target/liburing/opt/incus/lib/* /opt/incus/lib/

      - name: Build raft
        run: |
          cd /build/raft
          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/raft/
          DESTDIR=/build/target/raft/ make install
          rsync -a /build/target/raft/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/raft/opt/incus/lib/ /opt/incus/lib/

      - name: Build cowsql
        run: |
          REPO="${PWD}"

          cd /build/cowsql
          patch -p1 < "${REPO}/patches/cowsql-0001-discarded-qualifiers.patch"

          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/cowsql/
          DESTDIR=/build/target/cowsql/ make install
          rsync -a /build/target/cowsql/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/cowsql/opt/incus/lib/ /opt/incus/lib/

      - name: Build LXC
        run: |
          REPO="${PWD}"

          cd /build/lxc

          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Dexamples=false \
                  -Dman=false \
                  -Dtools=false \
                  -Dtests=false \
                  -Dmemfd-rexec=false \
                  -Dapparmor=true \
                  -Dseccomp=true \
                  -Dselinux=true \
                  -Dcapabilities=true \
                  -Dio-uring-event-loop=false
          meson compile -C build

          mkdir -p /build/target/lxc/
          DESTDIR=/build/target/lxc/ meson install -C build
          rsync -a /build/target/lxc/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/lxc/opt/incus/lib/ /opt/incus/lib/
          mkdir -p /opt/incus/share/lxc/config/common.conf.d/
          mkdir -p /opt/incus/share/lxc/hooks/
          cp /build/target/lxc/opt/incus/share/lxc/hooks/nvidia /opt/incus/share/lxc/hooks/

      - name: Build LXCFS
        run: |
          REPO="${PWD}"

          cd /build/lxcfs
          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Ddocs=false \
                  -Dtests=false
          meson compile -C build

          mkdir -p /build/target/lxcfs/
          DESTDIR=/build/target/lxcfs/ meson install -C build
          rsync -a /build/target/lxcfs/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/lxcfs/opt/incus/share/ /opt/incus/share/
          rsync -a /build/target/lxcfs/opt/incus/lib/ /opt/incus/lib/

          sed -i "s#/var/lib/lxcfs#/var/lib/incus-lxcfs#g" /opt/incus/share/lxcfs/lxc.mount.hook
          patch -p1 /opt/incus/share/lxcfs/lxc.mount.hook < "${REPO}/patches/lxcfs-0001-hook.patch"

      - name: Build Incus
        run: |
          REPO="${PWD}"

          cd /build/incus

          git cherry-pick 1bd01df82ea19ec7dba87041a4e3d8f8b42a47f2  # incusd/instance/lxc: Reject line breaks in LXC config values
          git cherry-pick e298fc7880b718398d2d8b4efd8b23bffc6d317d  # incusd/instance/lxc: Only parse config.json for OCI containers
          git cherry-pick 7c998495cf7f3f8f658492a116c7e15288ac9993  # incusd/instance/lxc: Keep loader variables out of the forklxc environment
          git cherry-pick cf2d213bb64f11c024aa5624c15bd239f3f5ec89  # incusd/dev_incus: Anchor the cgroup based monitor detection
          git cherry-pick 3c717818be57e21f7b782444a23404044426efd4  # incusd: Check resource creation against the effective project
          git cherry-pick 1f75f3da6bec34d62cc05a0b6b1e9065cb8d2cd9  # incusd/auth/tls: Restrict inherited reads to the certificate's projects
          git cherry-pick fce499bc012083af1301d641b0d045acd5900d6c  # incusd/operations: Protect token operations from events and cancellation
          git cherry-pick 43e6bdeb7530768c3bc2ae0feb2541e48fa365c3  # incusd/storage/s3: Verify signed payloads without buffering
          git am "${REPO}/patches/incus-0001-incusd-storage-Validate-dependent-volumes-received-t.patch"
          git cherry-pick f002fdb887845bc6fc7679cd63c06603a49c3bb5  # incusd/storage: Validate snapshot names from the backup index on import
          git am "${REPO}/patches/incus-0002-incusd-Only-trust-the-key-proven-client-certificate.patch"
          git cherry-pick 2876803d02651cc9b5efc95483411878047b3748  # incusd/dev_incus: Pin image export to the instance's project
          git cherry-pick dc2d0c836c57b69e65625e48db3a28c3dd76cd66  # incusd/events: Restrict network-acl events to privileged viewers
          git cherry-pick 0df451f531b57d18090988340a906ed49d310024  # incusd/instance/lxc: Allocate an idmap when none is set at start
          git cherry-pick 6af74594a80a048f8e2354f4a56f77e63e74ac92  # incusd: Authorize effective project on resource creation
          git cherry-pick aca14711ed4c6b8c24aa00e46c632b456e09200c  # incusd: Fix cross-project disclosure in recursive and all-projects listings
          git cherry-pick a8b2c791e0821b4cee872766cdca5df87e0ad6dc  # incusd/storage: Strip non-regular files from instance metadata
          git am "${REPO}/patches/incus-0003-incusd-instance-qemu-Confine-NBD-migration-sockets-t.patch"
          git cherry-pick dd00e2b2e929bd03c190445e7d991e1ffd03788f  # incusd: Reject null snapshot entries on backup import
          git cherry-pick b6c832ba41e0eb92442e0c7491bb2c329134f2b2  # incusd/operations: Keep websocket secrets out of events and queries
          git cherry-pick 182f53681578b92c39d7b8e3bd77138f4d0bee18  # incusd/network_allocations: Fix project handling
          git cherry-pick e929a56377d4f783b0ff128014545b0e1c20b648  # incusd/images: Remove old image files from members after a refresh
          git cherry-pick d6d422a287f8097b2db801011f907cec46bfca19  # incusd/images: Keep replaced image files while another project uses them
          git cherry-pick 4ded8be7a3ab61015d04b8cb5ad9f2e745129710  # incusd/network/acl: Notify cluster members of ACL changes used by NICs
          git am "${REPO}/patches/incus-0004-incusd-Check-certificate-ownership-on-every-non-admi.patch"
          git am "${REPO}/patches/incus-0005-incusd-auth-tls-Only-inherit-default-project-objects.patch"
          git am "${REPO}/patches/incus-0006-incusd-Authorize-dependent-volumes-on-backup-import.patch"
          git am "${REPO}/patches/incus-0007-incusd-operations-Strip-the-state-secret-from-render.patch"
          git am "${REPO}/patches/incus-0008-incusd-storage-s3-Bound-aws-chunked-chunk-sizes.patch"
          git am "${REPO}/patches/incus-0009-incusd-Limit-non-streaming-bodies-on-large-request-e.patch"
          git am "${REPO}/patches/incus-0010-incusd-Forbid-push-mode-migration-in-restricted-proj.patch"
          git am "${REPO}/patches/incus-0011-incusd-storage-Check-project-restrictions-on-instanc.patch"
          git am "${REPO}/patches/incus-0012-incusd-migration-Bound-the-size-of-protocol-messages.patch"
          git am "${REPO}/patches/incus-0013-incusd-instance-qemu-Reject-quotes-and-line-breaks-i.patch"
          git am "${REPO}/patches/incus-0014-incusd-device-tpm-Read-device-numbers-from-sysfs.patch"
          git am "${REPO}/patches/incus-0015-incusd-device-nic_bridged-Restrict-host-side-routes-.patch"
          git am "${REPO}/patches/incus-0016-incusd-storage-Validate-snapshot-names-received-thro.patch"
          git am "${REPO}/patches/incus-0017-incusd-metrics-Escape-label-values.patch"
          git am "${REPO}/patches/incus-0018-incusd-instances-Enforce-restricted.snapshots-on-cop.patch"
          git am "${REPO}/patches/incus-0019-incusd-storage-Reject-a-symlinked-block-file-when-un.patch"
          git am "${REPO}/patches/incus-0020-incusd-instance-lxc-Enable-the-devices-cgroup-for-al.patch"
          git am "${REPO}/patches/incus-0021-tests-Allow-snapshots-in-the-restricted-backup-impor.patch"
          git am "${REPO}/patches/incus-0022-incusd-auth-Treat-unknown-certificates-as-restricted.patch"
          git am "${REPO}/patches/incus-0023-incusd-Ignore-client-supplied-forwarded-requestor-he.patch"
          git am "${REPO}/patches/incus-0024-incusd-auth-Keep-metrics-certificates-to-metrics-acc.patch"
          git am "${REPO}/patches/incus-0025-incusd-Block-remote-clients-during-startup.patch"
          git am "${REPO}/patches/incus-0026-incusd-Don-t-let-the-owner-re-key-a-CA-trusted-restr.patch"
          git am "${REPO}/patches/incus-0027-incusd-Identify-CA-issued-certificates-by-their-sign.patch"
          git am "${REPO}/patches/incus-0028-incusd-auth-oidc-Bind-JWT-access-tokens-to-the-clien.patch"
          git am "${REPO}/patches/incus-0029-incusd-Stop-restricted-clients-rewriting-their-certi.patch"
          git am "${REPO}/patches/incus-0030-incusd-Keep-a-cluster-member-s-server-certificate-na.patch"
          git am "${REPO}/patches/incus-0031-incusd-Don-t-resolve-locale-or-NSS-modules-from-the-.patch"
          git am "${REPO}/patches/incus-0032-incusd-Don-t-leak-descriptors-into-the-intercepted-m.patch"
          git am "${REPO}/patches/incus-0033-incusd-rsync-Only-accept-the-rsync-helper-on-the-tra.patch"
          git am "${REPO}/patches/incus-0034-incusd-Harden-forkproxy-unix-socket-handling.patch"
          git am "${REPO}/patches/incus-0035-incusd-seccomp-Validate-the-notification-before-acti.patch"
          git am "${REPO}/patches/incus-0036-incusd-Lock-read-only-on-hot-plugged-idmapped-disks.patch"
          git am "${REPO}/patches/incus-0037-incusd-Confine-backup-and-publish-walks-to-the-volum.patch"
          git am "${REPO}/patches/incus-0038-incusd-storage-Match-the-volume-content-type-on-file.patch"
          git am "${REPO}/patches/incus-0039-incusd-storage-Reject-a-custom-volume-refresh-that-c.patch"
          git am "${REPO}/patches/incus-0040-incusd-storage-Resolve-bucket-backup-before-export.patch"
          git am "${REPO}/patches/incus-0041-incusd-Validate-the-image-fingerprint-before-recordi.patch"
          git am "${REPO}/patches/incus-0042-incusd-storage-Validate-initial.mode-as-an-octal-mod.patch"
          git am "${REPO}/patches/incus-0043-incusd-Restrict-image-delta-base-to-an-owned-fingerp.patch"
          git am "${REPO}/patches/incus-0044-incusd-storage-Serialize-custom-volume-content-again.patch"
          git am "${REPO}/patches/incus-0045-incusd-Lock-the-instance-during-rebuild.patch"
          git am "${REPO}/patches/incus-0046-incusd-Lock-the-instance-during-rename.patch"
          git am "${REPO}/patches/incus-0047-incusd-storage-Reject-rootfs-content-in-a-split-imag.patch"
          git am "${REPO}/patches/incus-0048-incusd-Keep-instance-volume-directories-root-owned-o.patch"
          git am "${REPO}/patches/incus-0049-incusd-device-Reject-.-components-in-device-mount-pa.patch"
          git am "${REPO}/patches/incus-0050-incusd-device-Mount-disk-staging-bind-mounts-nosuid.patch"
          git am "${REPO}/patches/incus-0051-incusd-Take-VM-disk-format-from-config-on-publish-an.patch"
          git am "${REPO}/patches/incus-0052-incusd-storage-Reject-non-self-contained-VM-images-o.patch"
          git am "${REPO}/patches/incus-0053-incusd-device-Forbid-guest-root-on-restricted-VM-dis.patch"
          git am "${REPO}/patches/incus-0054-incusd-project-Forbid-raw.idmap-mapping-onto-contain.patch"
          git am "${REPO}/patches/incus-0055-incusd-device-Treat-a-source-as-external-ceph-only-w.patch"
          git am "${REPO}/patches/incus-0056-incusd-Don-t-let-an-image-plant-a-liblxc-config-file.patch"
          git am "${REPO}/patches/incus-0057-incusd-project-Fail-closed-when-the-checked-profile-.patch"
          git am "${REPO}/patches/incus-0058-incusd-Serialize-instance-rewrites-on-volume-rename-.patch"
          git am "${REPO}/patches/incus-0059-incusd-instance-Return-a-copy-of-the-local-config-fr.patch"
          git am "${REPO}/patches/incus-0060-incusd-Check-project-restrictions-after-the-move-poo.patch"
          git am "${REPO}/patches/incus-0061-incusd-project-Treat-volatile.selinux.context-as-a-r.patch"
          git am "${REPO}/patches/incus-0062-incusd-Keep-the-imported-root-disk-on-the-import-poo.patch"
          git am "${REPO}/patches/incus-0063-incusd-network-ovn-Validate-pinned-uplink-addresses-.patch"
          git am "${REPO}/patches/incus-0064-incusd-seccomp-Keep-intercepted-syscall-strings-NUL-.patch"
          git am "${REPO}/patches/incus-0065-incusd-instance-qemu-Keep-secrets-out-of-the-QMP-log.patch"
          git am "${REPO}/patches/incus-0066-incusd-storage-Validate-bucket-key-names-and-credent.patch"
          git am "${REPO}/patches/incus-0067-incusd-storage-Keep-the-pool-config-out-of-exports-a.patch"
          git am "${REPO}/patches/incus-0068-incusd-Hide-credentials-in-the-server-config-from-no.patch"
          git am "${REPO}/patches/incus-0069-incusd-db-Scope-backup-records-to-their-owner.patch"
