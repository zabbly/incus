name: Builds
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-incus:
    name: Build Incus
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        arch:
          - amd64
          - arm64
    runs-on:
      - self-hosted
      - zabbly-incus-build
      - arch-${{ matrix.arch }}
      - image-${{ matrix.os }}

    env:
      OS_ARCH: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os }}
      PKG_CONFIG_PATH: "/opt/incus/lib/pkgconfig/"
      CGO_LDFLAGS: "-L/opt/incus/lib/"
      CGO_CFLAGS: "-I/opt/incus/include/"
      LD_LIBRARY_PATH: "/opt/incus/lib/"
      CPATH: "/opt/incus/include/"
      PATH: "/home/runner/.cargo/bin:/home/runner/.local/bin:/opt/incus/bin:/usr/local/go/bin:/usr/local/node/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin"

      # Linux Containers projects
      DISTROBUILDER_TAG: "distrobuilder-3.2"
      INCUS_TAG: "v7.2.0"
      INCUS_UI_CANONICAL_TAG: "incus-0.21.5"
      LXCFS_TAG: "v7.0.0"
      LXC_TAG: "v7.0.0"

      # External dependencies
      COWSQL_TAG: "v1.15.9"
      CRIU_TAG: "v4.2.1"
      EDK2_TAG: "edk2-stable202605"
      GOLANG_TAG: "go1.26.5"
      LEGO_TAG: "v4.35.2"
      LIBTPMS_TAG: "v0.10.2"
      LIBURING_TAG: "liburing-2.15"
      NASM_TAG: "nasm-2.16.03"
      NVIDIA_CONTAINER_TAG: "v1.19.1"
      QEMU_TAG: "v11.0.3"
      RAFT_TAG: "v0.22.1"
      SEABIOS_TAG: "rel-1.17.0"
      SKOPEO_TAG: "v1.24.0"
      SWTPM_TAG: "v0.10.1"
      TRUENAS_INCUS_CTL_TAG: "v0.7.7"
      VIRTIOFSD_TAG: "v1.14.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global --add advice.detachedHead false
          git config --global user.email "noreply@zabbly.com"
          git config --global user.name "Zabbly Incus build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            acpica-tools \
            asciidoc \
            autoconf \
            automake \
            bison \
            bmake \
            build-essential \
            curl \
            debhelper \
            devscripts \
            dosfstools \
            expect \
            flex \
            gawk \
            gettext \
            gnutls-bin \
            gnutls-dev \
            git \
            iproute2 \
            libacl1-dev \
            libaio-dev \
            libapparmor-dev \
            libbtrfs-dev \
            libcap-dev \
            libcap-ng-dev \
            libdbus-1-dev \
            libdevmapper-dev \
            libelf-dev \
            libfuse3-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            libgpgme-dev \
            libjson-glib-dev \
            libnet1-dev \
            libnl-3-dev \
            libnuma-dev \
            libpam0g-dev \
            libpixman-1-dev \
            libpng-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            librbd-dev \
            libseccomp-dev \
            libselinux1-dev \
            libspice-server-dev \
            libsqlite3-dev \
            libssl-dev \
            libsystemd-dev \
            libtirpc-dev \
            libtool \
            libudev-dev \
            libusb-1.0-0-dev \
            libusbredirhost-dev \
            libuv1-dev \
            lsb-release \
            mtools \
            ninja-build \
            pipx \
            pkg-config \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-cryptography \
            python3-jinja2 \
            python3-pexpect \
            python3-pip \
            python3-setuptools \
            python3-tomli \
            python3-venv \
            rsync \
            socat \
            uuid-dev \
            xmlto \
            xorriso

          sudo apt-get install --no-install-recommends --yes systemd-dev || true

          pipx install meson

      - name: Install Go
        run: |
          curl -sL "https://go.dev/dl/${GOLANG_TAG}.linux-${OS_ARCH}.tar.gz" | sudo tar -C /usr/local/ -zx
          go version

      - name: Install Rust
        run: |
          curl -sL https://sh.rustup.rs -o install-rust.sh
          bash install-rust.sh -y

      - name: Install Node
        run: |
          [ "${OS_ARCH}" = "amd64" ] && NODE_ARCH=x64
          [ "${OS_ARCH}" = "arm64" ] && NODE_ARCH=arm64


          sudo mkdir /usr/local/node/
          curl -sL "https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-${NODE_ARCH}.tar.xz" | sudo tar -C /usr/local/node/ -Jx --strip-components=1

      - name: Build environment
        run: |
          sudo mkdir -p /build/ /opt/
          sudo chown $(id -u):$(id -g) /build/ /opt/

          mkdir -p \
            /opt/incus/bin/ \
            /opt/incus/include/ \
            /opt/incus/lib/ \
            /opt/incus/lib/systemd \
            /opt/incus/share/

      - name: Get the code
        run: |
          git clone https://github.com/lxc/distrobuilder /build/distrobuilder --depth 1 -b "${DISTROBUILDER_TAG}"
          git clone https://github.com/lxc/lxc /build/lxc -b "${LXC_TAG}"
          git clone https://github.com/lxc/lxcfs /build/lxcfs --depth 1 -b "${LXCFS_TAG}"
          git clone https://github.com/lxc/incus /build/incus -b "${INCUS_TAG}"
          git clone https://github.com/zabbly/incus-ui-canonical /build/incus-ui-canonical --depth 1 -b "${INCUS_UI_CANONICAL_TAG}"

          git clone https://github.com/axboe/liburing /build/liburing --depth 1 -b "${LIBURING_TAG}"
          git clone https://github.com/checkpoint-restore/criu /build/criu --depth 1 -b "${CRIU_TAG}"
          git clone https://github.com/containers/skopeo /build/skopeo --depth 1 -b "${SKOPEO_TAG}"
          git clone https://github.com/cowsql/cowsql /build/cowsql --depth 1 -b "${COWSQL_TAG}"
          git clone https://github.com/cowsql/raft /build/raft --depth 1 -b "${RAFT_TAG}"
          git clone https://github.com/go-acme/lego /build/lego --depth 1 -b "${LEGO_TAG}"
          git clone https://github.com/NVIDIA/libnvidia-container /build/libnvidia-container --depth 1 -b "${NVIDIA_CONTAINER_TAG}"
          git clone https://github.com/stefanberger/libtpms /build/libtpms --depth 1 -b "${LIBTPMS_TAG}"
          git clone https://github.com/stefanberger/swtpm /build/swtpm --depth 1 -b "${SWTPM_TAG}"
          git clone https://github.com/tianocore/edk2 /build/edk2 --recurse-submodules --shallow-submodules --depth 1 -b "${EDK2_TAG}"
          git clone https://github.com/truenas/truenas_incus_ctl /build/truenas_incus_ctl --depth 1 -b "${TRUENAS_INCUS_CTL_TAG}"
          git clone https://gitlab.com/qemu-project/qemu /build/qemu --depth 1 -b "${QEMU_TAG}"
          git clone https://gitlab.com/qemu-project/seabios /build/seabios --depth 1 -b "${SEABIOS_TAG}"
          git clone https://gitlab.com/virtio-fs/virtiofsd /build/virtiofsd --depth 1 -b "${VIRTIOFSD_TAG}"

          mkdir /build/nasm/
          curl -sL "https://www.nasm.us/pub/nasm/releasebuilds/$(echo ${NASM_TAG} | cut -d- -f2)/${NASM_TAG}.tar.gz" --resolve www.nasm.us:443:198.137.202.136 | tar -C /build/nasm/ -zx --strip-components=1

      - name: Build liburing
        run: |
          cd /build/liburing
          ./configure --prefix=/opt/incus
          make

          mkdir -p /build/target/liburing/
          DESTDIR=/build/target/liburing make install
          rsync -a /build/target/liburing/opt/incus/include/* /opt/incus/include/
          rsync -a /build/target/liburing/opt/incus/lib/* /opt/incus/lib/

      - name: Build raft
        run: |
          cd /build/raft
          autoreconf -i
          ./configure --prefix=/opt/incus
          make

          mkdir -p /build/target/raft/
          DESTDIR=/build/target/raft/ make install
          rsync -a /build/target/raft/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/raft/opt/incus/lib/ /opt/incus/lib/

      - name: Build cowsql
        run: |
          REPO="${PWD}"

          cd /build/cowsql
          patch -p1 < "${REPO}/patches/cowsql-0001-discarded-qualifiers.patch"

          autoreconf -i
          ./configure --prefix=/opt/incus
          make

          mkdir -p /build/target/cowsql/
          DESTDIR=/build/target/cowsql/ make install
          rsync -a /build/target/cowsql/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/cowsql/opt/incus/lib/ /opt/incus/lib/

      - name: Build LXC
        run: |
          REPO="${PWD}"

          cd /build/lxc

          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Dexamples=false \
                  -Dman=false \
                  -Dtools=false \
                  -Dtests=false \
                  -Dmemfd-rexec=false \
                  -Dapparmor=true \
                  -Dseccomp=true \
                  -Dselinux=true \
                  -Dcapabilities=true \
                  -Dio-uring-event-loop=false
          meson compile -C build

          mkdir -p /build/target/lxc/
          DESTDIR=/build/target/lxc/ meson install -C build
          rsync -a /build/target/lxc/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/lxc/opt/incus/lib/ /opt/incus/lib/
          mkdir -p /opt/incus/share/lxc/config/common.conf.d/
          mkdir -p /opt/incus/share/lxc/hooks/
          cp /build/target/lxc/opt/incus/share/lxc/hooks/nvidia /opt/incus/share/lxc/hooks/

      - name: Build LXCFS
        run: |
          REPO="${PWD}"

          cd /build/lxcfs
          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Ddocs=false \
                  -Dtests=false
          meson compile -C build

          mkdir -p /build/target/lxcfs/
          DESTDIR=/build/target/lxcfs/ meson install -C build
          rsync -a /build/target/lxcfs/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/lxcfs/opt/incus/share/ /opt/incus/share/
          rsync -a /build/target/lxcfs/opt/incus/lib/ /opt/incus/lib/

          sed -i "s#/var/lib/lxcfs#/var/lib/incus-lxcfs#g" /opt/incus/share/lxcfs/lxc.mount.hook
          patch -p1 /opt/incus/share/lxcfs/lxc.mount.hook < "${REPO}/patches/lxcfs-0001-hook.patch"

      - name: Build Incus
        run: |
          REPO="${PWD}"

          cd /build/incus

          git cherry-pick c9a2d2ee52f4ed352027bb840714c931ce2e61a9  # cmd/incusd: `isolated` on `restricted.containers.privilege` prevents setting `security.privileged` to `true`
          git cherry-pick 10a2343604d148e66f2142d69c106b36cdf20872  # doc: regenerate configurable options index
          git cherry-pick 388c9e6cdb8db152c275441affaf9fe389493915  # api: regenerate `/1.0/metadata/configuration` options
          git cherry-pick 30c603507e631eb90ed189a9803709a95ed61c71  # incus/move: Apply --storage pool to dependent disks
          git cherry-pick f7f0a7aa18fda9898c3a88148601702c26d7f238  # doc: fix `config set` deprectation warning
          git cherry-pick c97d867faabce3bb56176709396b0506afc0d95e  # incusd/firewall: Fix double Wait in nftParseRuleset
          git cherry-pick 713a400c979c2473e40f813a92246b7788aebe17  # incusd/device: Allow static CIDR address on unmanaged bridge
          git cherry-pick 9ad1a55d69d0f20e674496d2e6d60ff9879b5360  # incusd/instance/qemu/qmp: Run guest memory dump detached
          git cherry-pick cce895d44c3de6a8d9a3da353bf94db8774df0e0  # incusd/instance/qemu/qmp: Add per-command timeout
          git cherry-pick 31de4be43c17eafa6c9aa516f9f5a99cea1569c6  # shared/logger: Add WarnOnErrorExcept helper
          git cherry-pick 7a6df891b5c60087333458479fc6757b4055a586  # incus: Avoid double-close warning on volume/bucket/instance import
          git cherry-pick bfece20827965836d27c90579be4a766e6ac4748  # incusd/device: Reset VM disk I/O limits on unset
          git cherry-pick 6eb95b4dae48ac81be7e4ca4b13e4c637f343234  # incusd/devices: Allow /32 and /128 for OCI addresses
          git cherry-pick 661d3c36df2467e36f5b80208aa11d4ef7833526  # incusd/operations: Fix nil deref race in Cancel
          git cherry-pick 2954ccafa9a29b62ec02f9cd57a36d136441c680  # cmd/generate-database/db: Manually specify uuid package
          git cherry-pick 6daacfba2212d0cd09ee3bc4f0d16bba30eedfc8  # incusd/instance/qemu/qmp: Bump timeout for block commands
          git cherry-pick 4315a6470c7293410a35493391b8f18cfc6e76ab  # incusd/instance/qemu/qmp: Bump timeout for slow synchronous commands
          git cherry-pick 40c8d60da3cb09c3b2135ca9d06ec838da8dad50  # incus: Avoid double-close warning on export and file pull
          git cherry-pick 3340de6bcf5ce49c896ed2359043ee53d6bbcea0  # doc/incus-cli: reword docs for configuration file path
          git cherry-pick 0dada138cb52c0633c8f4fad102155a9d0d2e536  # incusd/device/disk: Use resolved project for Ceph ISO RBD names
          git cherry-pick 047f5295b41579ce1497ae6f4e3622c334afad71  # incusd: Switch OCI network configuration to interfaces.json
          git cherry-pick c9348b64e60f0a817a3353f5fb36be0ebe2f03fa  # incusd/device: Mention "none" as valid NIC gateway value
          git cherry-pick c0fa4b2e642d2bba66e27d497e23a6fda6b79d07  # incusd: Support "none" gateways in OCI containers
          git cherry-pick 5030da4a504edd8cddbae4e5a57a9097dce18dc2  # doc: Update configuration option metadata
          git cherry-pick ecfec11bca7a053eb1c8202a05dbaa367f3cd121  # incusd/instance/qmp: Bump some more timeouts
          git cherry-pick 9c6002e864bbaac617331cb7dd2028d3187ec76f  # incusd: Use constant-time comparison for secrets
          git cherry-pick ee81502afe879599eb7124c170724f842ea4ddb2  # incusd: Limit websocket control message size
          git cherry-pick de3d67d43a9cd71a96317d77b8e28a9995f35f26  # incusd/device: Use IsAPIName for device name validation
          git cherry-pick 4030981f25b2016c6e99d1b0aa43b624fd84e438  # incusd/storage/s3: Pin certificate for local S3 bucket transfers
          git cherry-pick 65025e292df9adad2efd211cccc515ee65f3955b  # incusd/db/query: Use hex blob literal in database dumps
          git cherry-pick d416f3c6216ce63d23c4ac8f8e289d15438cd273  # incusd/instance/qemu: Use a shared memory backend on all architectures
          git cherry-pick 58e7b5cb502732f6bb114d65497a1923433508a2  # incusd/storage: Honor btrfs.compression on instances from optimized images
          git cherry-pick a07f9326d66ed0ad6a3412595b79bc3ce1aba94a  # test: Cover btrfs.compression on instances from optimized images
          git cherry-pick b32e98aec2c657a156d36268a35b0db2ad88b1b3  # incusd/storage/s3: Add GetBucketVersioning
          git cherry-pick 629a8853722bd64f43b25706e37e7e5505af215b  # incusd/forknet: Wait up to 5s for initial DHCP configuration
          git cherry-pick 7c42ac4c479c1980dfb8efc224844859efa43ef5  # incusd/instance/qemu: Handle missing kvm64
          git cherry-pick b7f8d10487c323f4672bb1c3b9eb8a361aa8dc75  # client: Only pass device overrides to sources supporting them
          git cherry-pick 3b370a4ff2435f3d44876cccea93071b325bcd7e  # incusd/instance/qemu: Serialize CPU pinning data in the CPU topology
          git cherry-pick f3286684948fe294ce58f1b19fa3a1db5f2cb5bb  # incusd/instance/qemu: Re-compute CPU pins on stateful start
          git cherry-pick a08f2fadd5f235c5a93a75bf1997c30b5757bb91  # incus: Fix remote path handling on Windows
          git cherry-pick 86395a281f4e75f2b57588081b6ecd8c7415c051  # incusd/forksyscall: Fix mknod emulation for relative paths
          git cherry-pick 82800c3e65ce4a8e401b5e277ffe8542d092848e  # internal/instance: Mention cgroup2 limitations
          git cherry-pick 114ffb2dc0af29cbd5967a75f5df2613283d11ac  # doc: Update config
          git cherry-pick da70ae3b0d366dd964653e579864e1eeb3348825  # incusd/dev_incus: Fix race in ConnPidMapper access
          git cherry-pick 45439e0b23035427d44ef2e727bd79b1e99f0ede  # incusd/forksyscall: Check for path truncation in mknod emulation
          git cherry-pick 3e060957ae414c4dc8e06d4742e93e5c9e7237c2  # incusd: Fix race between forkfile cleanup and respawn
          git cherry-pick 1fc57eb2845dfb6f5a6bcfb122812210c0a97a49  # incusd/events: Don't warn on double connection close
          git cherry-pick 638b84e0186eb550359cd2b18786f4bba8585622  # incusd/apparmor: Fix alignment
          git cherry-pick 0a44fb46ad562ebb6c272ae3352340c8e7a5cb15  # incusd/network/bridge: Don't NAT traffic between managed bridge networks
          git cherry-pick 1bec4f6e17448cc78e068d505dfc2aa2591e572e  # incusd/storage/zfs: Clear volume quota during optimized refresh
          git cherry-pick 1e0048499b630f69a8a7cdb9cb943c6fd71decb1  # incusd/storage/zfs: Restore volume quota on refresh error
          git cherry-pick c7faf0ba52721f048c9042bd0e68d55123fe3be1  # incusd/seccomp: Handle syscalls from non-leader threads
          git cherry-pick 34724d98872508fe2668a64d3146c87eae614202  # incusd/instance/lxc: Stop the DHCP client from the stop hook
          git cherry-pick 637a1b2bea132b9dd789c1831378fb2555376e04  # shared/tls: Use first successful connection in RFC3493Dialer
          git cherry-pick 20634a7ac3e8c398d41979bc47084c3c9cb51063  # incusd/instances/common: Fix typo
          git cherry-pick 0987a2811f2c4b7e719072f83c0e699afe27a3f3  # incusd/device: Handle CIDR values in NIC ipv4.address/ipv6.address
          git cherry-pick d55af0889cd0062f94795dc65f3153610aae8647  # incusd/network: Handle CIDR values in NIC ipv4.address/ipv6.address
          git cherry-pick bd77bb04ab21bdaf600f820915e9698ff618687a  # client: Only retry TLS dial on certificate verification errors
          git cherry-pick 87113f1ac47c3cf0673f4c01ae40b89789966830  # incusd/network/ovn: Tolerate stop failures during network deletion
          git cherry-pick 38ef9b430b1d7fd880975bb2b914b7c5668c8313  # incusd/device/nic_ovn: Guard cleanup against unavailable network
          git cherry-pick 4b3738bf60120d9036fb1dd2385f68e85c83b70e  # incusd/networks: Run driver deletion for locally pending networks
          git cherry-pick 9a15499763158db4cc2c3517f271c432b467efa6  # incusd: Honor target parameter in bitmap endpoints
          git cherry-pick 9e03109e5fad756d2c058a49574c1af1c2914622  # incusd/cluster: Resolve instance volumes by name in ConnectIfVolumeIsRemote
          git cherry-pick 235209442b1dbb0cc36223730485e300527bf2e1  # incus/console: Escape spaces in SPICE console socket URI
          git cherry-pick f3007efb9e3d26827c6ee6ca16b127ceed5b9127  # incus: Don't persist INCUS_REMOTE as the default remote
          git cherry-pick 9cca05ee73ea439f3e817b2a04cb414ed61583ad  # incusd/storage/s3: Support conditional writes
          git cherry-pick bcffa337ac99f34a30a452d82c7567a7fd1d1fde  # incusd/instance/qmp: Rework block job monitoring
          git cherry-pick 25fd79d0c499c96b22c1de9d3fea631b6f497e4f  # incusd/instance/qemu: Harden ephemeral snapshot teardown
          git cherry-pick 6b2c703e556b7149d64bfe3d2cb66483b1b7f9cb  # client: Always set TLS ServerName on dial
          git cherry-pick be58aa58b2b33c263fb1c9a03382f7df9b278841  # incusd/storage/btrfs: Restrict subvolume sources under the daemon dir
          git cherry-pick 45076c7dc153ceb4e92c2b031a4047fe221f5d04  # incusd: Don't warn on double close of downloaded image files
          git cherry-pick 074fe22ddbc64fce667acb3513576f8c1ed8d10f  # incus/file: Fix progress reporting on stdin push
          git cherry-pick c68f48dc7ffa80df9f122ea5e3c9f5504d39f924  # incus/import: Fix progress reporting on stdin import
          git cherry-pick 999c8de084dffa2ce722c31ae38829a381f38e92  # incus/storage_bucket: Fix progress reporting on stdin import
          git cherry-pick 73e21cb367ee0f81445e78b25aa02c786a6fc8d2  # incus/storage_volume: Fix progress reporting on stdin import
          git cherry-pick d8785a33e3f3f73665e51fe342fd40e6128164f1  # incus/storage_volume_file: Fix progress reporting on stdin push
          git cherry-pick b6401990dcdf9a6f4caa2683b5399a1e0c293b4d  # incusd/network/zone: Return a single SOA record on plain SOA queries
          git cherry-pick d83b8378017abdc3a38a18fe04138355d88ab663  # incusd/storage: Fix races in connectOfflineNBD
          git cherry-pick f1ac29c64a18d1eb517fd158cea4c46cbe39a8ef  # incusd/locking: Make unlock functions release only their own lock
          git cherry-pick 0dbf1bf15479e43a54f99530d21a024b37ca1601  # incusd/storage: Hold NBD operation lock for the whole session
          git cherry-pick d463e0c7e27318e5ce605c47795e75a09d421f56  # incusd/network/ovn: Detect stale database connections
          git cherry-pick ff460a7ad8543d7a9d613c4e78dec0bf2970775b  # incusd/network/ovn: Remove NB client singleton
          git cherry-pick 3cfdb63fc77315e0e7edcaa65959906180c1bddb  # incusd/storage: Use qcow2 virtual size as instance block size
          git cherry-pick 1aa57342d24a4078189da01ea1a9a868e45b3c5c  # incusd/storage: Skip root disk size check on remote cluster move
          git cherry-pick 03304f19be5c805d1e9c685b9005ae528944b5a3  # incusd/device: Require CIDR address when NIC gateway is set
          git cherry-pick 4dc199911e1a55265c82031c1a864e65f4d9e2b4  # incusd/storage: Honor writable flag on offline NBD exports
          git cherry-pick 8e6be87173db8560a3f8010ef733bec04e11a91b  # incusd/seccomp: Use namespace credentials for FUSE mounts
          git cherry-pick 5daa427d330004609859ab6f19b6101d3479d59c  # incusd/dev_incus: Detect LXC monitors from cgroup v2
          git cherry-pick 0536e21c44caa92f7b08255b56e3ba3348a2a77f  # Add storage note about loop devices on COW fs
          git cherry-pick 551cb17c9db56c1178c99769f5b7c30520a426ce  # incusd/instance/lxc: Use project-qualified CRIU restore name
          git cherry-pick f0e5ef57bfdbb2a3472f2381664e7f6d4c974526  # incusd/instance/lxc: Clean devices after failed CRIU restore
          git cherry-pick 8dc586604b06f70c15e4cdcc2bb297265f5f2d29  # incusd/storage: Fix instance copy for non-block volumes
          git cherry-pick cb5e8b355e635e76d1cf4b0eaeed6ab1d0bc8106  # shared/ask: fix password prompt loop on Windows
          git cherry-pick 5e13eea4c8356da680aed208ad4c6514b10a27a0  # incusd/storage: Add support for '--refresh' for instances with dependent disks
          git cherry-pick 9ed4d2eea304c2383b5c2437a4331db9383ce7ac  # shared/ask: Fix newlines after functional blocks
          git cherry-pick f691ce8b6d6ce2fcc78ca045fff45e9e68d1fc97  # incusd/storage/drivers: Don't set received UUID on main btrfs volume
          git cherry-pick a9f934b6e9a7d42cec8d01600b02bef2be9277f0  # incusd: Add cpus= argument to forkqemu
          git cherry-pick 98aff5e6fdee62d78ce62f46bcff1c145677fd51  # incusd/instance/qemu: Confine QEMU startup to a single CPU type
          git cherry-pick dcba4687e26e9d802570d2bde31f2038f6df7deb  # incusd/instance/lxc: Fix OCI entrypoint escaping
          git cherry-pick 0401f92dcf652c4d6401dd0661dafeb13cb2cf16  # incusd/seccomp: Report FUSE mount helper failures
          git cherry-pick e935de598c4d98898ca3561d08a6a421bfbe9dea  # incusd/storage/drivers: Fix volume activation of filesystem snapshots
          git cherry-pick fb4041f4213574f504f5b03e94c82a2905e8c5e8  # incusd/storage: Strip unsafe symlinks in externally-supplied instance data
          git cherry-pick 6c8ebb4efa37c7372357960315dbb034476ed529  # incusd/storage/s3: Reject symlinks in bucket backups
          git cherry-pick 8494ac459724151091b2897b7284ffa0a260b796  # incusd/instance/qemu: Fix publish of qcow2-backed volumes
          git cherry-pick 93ed8b9429db341f6315425ded74a6b010c109f1  # incusd/auth: Fill missing local bucket location
          git cherry-pick 48b508bca0a87a0b7e332ca0137dd0157b9d32f8  # doc: Ignore bugzilla.opensuse.org in linkcheck
          git cherry-pick 4cd8307ac93a2998f98ec0a785a9978427250379  # incusd/storage: Allow expected symlinks in instance metadata
          git cherry-pick 58207a3c5c955bab82a4871950dc1eb705b3b6b7  # incusd/instance/qmp: Bump blockdev-add/del timeouts
          git cherry-pick 88d7bceb063446ce0a5099af47c83fba8e056cc0  # internal/filter: Prefer exact key match in ValueOf
          git cherry-pick 3cdd7b93202dec80ab49b6db00c0a64b4e8179f4  # internal/filter: Only allow abbreviating the namespace in DotPrefixMatch
          git cherry-pick f07c63ef98fc7d676bb795185df8fdc6b1e113ed  # internal/filter: Workaround spellcheck

          go build -o "/opt/incus/bin/fuidshift" github.com/lxc/incus/v7/cmd/fuidshift
          go build -o "/opt/incus/bin/incus" github.com/lxc/incus/v7/cmd/incus
          go build -o "/opt/incus/bin/incus-benchmark" github.com/lxc/incus/v7/cmd/incus-benchmark
          go build -o "/opt/incus/bin/incus-migrate" github.com/lxc/incus/v7/cmd/incus-migrate
          go build -o "/opt/incus/bin/incus-simplestreams" github.com/lxc/incus/v7/cmd/incus-simplestreams
          go build -o "/opt/incus/bin/incus-user" github.com/lxc/incus/v7/cmd/incus-user
          go build -o "/opt/incus/bin/incusd" -tags=libsqlite3 github.com/lxc/incus/v7/cmd/incusd
          go build -o "/opt/incus/bin/lxc-to-incus" github.com/lxc/incus/v7/cmd/lxc-to-incus

          mkdir -p /opt/incus/agent
          if [ "$(uname -m)" = "x86_64" ]; then
              GOARCH=amd64 GOOS=darwin CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.macos.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent

              GOARCH=amd64 GOOS=freebsd CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.freebsd.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=386 GOOS=freebsd CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.freebsd.i686" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent

              GOARCH=amd64 CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.linux.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=386 CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.linux.i686" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent

              GOARCH=amd64 GOOS=windows CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.windows.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=386 GOOS=windows CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.windows.i686" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
          elif [ "$(uname -m)" = "aarch64" ]; then
              GOARCH=arm64 GOOS=darwin CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.macos.aarch64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=amd64 GOOS=freebsd CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.freebsd.aarch64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=arm64 CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.linux.aarch64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              GOARCH=arm64 GOOS=windows CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.windows.aarch64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
          fi

          make build-mo
          mkdir -p /opt/incus/share/locale
          cp po/*.mo /opt/incus/share/locale/

          make doc
          cp -R doc/html /opt/incus/doc

          mkdir -p /opt/incus/share/completions/
          /opt/incus/bin/incus completion bash > /opt/incus/share/completions/bash
          /opt/incus/bin/incus completion fish > /opt/incus/share/completions/fish
          /opt/incus/bin/incus completion zsh > /opt/incus/share/completions/zsh

      - name: Build UI (canonical)
        run: |
          REPO="${PWD}"

          cd /build/incus-ui-canonical

          # Complete re-branding.
          find -type f -name "*.ts" -o -name "*.tsx" -o -name "*.scss" | xargs sed -i -f "${REPO}/patches/ui-canonical-renames.sed"

          npm install -g --prefix /home/runner/.local yarn
          yarn install
          yarn build

          mkdir -p /opt/incus/ui-canonical/
          rsync -a /build/incus-ui-canonical/build/ui/ /opt/incus/ui-canonical/

      - name: Build Distrobuilder
        run: |
          cd /build/distrobuilder
          go build -o "/opt/incus/bin/distrobuilder" github.com/lxc/distrobuilder/distrobuilder

      - name: Build CRIU
        run: |
          REPO="${PWD}"

          cd /build/criu

          make WERROR=0
          cp criu/criu /opt/incus/bin/

      - name: Build libnvidia-container
        run: |
          REPO="${PWD}"

          cd /build/libnvidia-container
          patch -p1 < "${REPO}/patches/nvidia-0001-Fix-for-22.04-build.patch"
          patch -p1 < "${REPO}/patches/nvidia-0002-pre-load-libdl.patch"
          make prefix=/

          mkdir /build/target/libnvidia-container
          DESTDIR=/build/target/libnvidia-container make install prefix=/
          rsync -a /build/target/libnvidia-container/bin/ /opt/incus/bin/
          rsync -a /build/target/libnvidia-container/include/ /opt/incus/include/
          rsync -a /build/target/libnvidia-container/lib/ /opt/incus/lib/

      - name: Build seabios
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          REPO="${PWD}"

          cd /build/seabios

          # Build a traditional seabios.
          make clean distclean
          echo "CONFIG_QEMU=y" > .config
          echo "CONFIG_QEMU_HARDWARE=y" >> .config
          echo "CONFIG_BOOTSPLASH=n" >> .config
          echo "CONFIG_ROM_SIZE=256" >> .config
          echo "CONFIG_XEN=n" >> .config
          echo "CONFIG_PVSCSI=n" >> .config
          echo "CONFIG_ESP_SCSI=n" >> .config
          echo "CONFIG_LSI_SCSI=n" >> .config
          echo "CONFIG_MEGASAS=n" >> .config
          echo "CONFIG_MPT_SCSI=n" >> .config
          echo "CONFIG_FLOPPY=n" >> .config
          echo "CONFIG_FLASH_FLOPPY=n" >> .config
          make oldnoconfig V=1
          make V=1 PYTHON=python3

          mkdir -p /opt/incus/share/qemu/
          cp out/bios.bin /opt/incus/share/qemu/seabios.bin

      - name: Build nasm
        run: |
          REPO="${PWD}"

          cd /build/nasm
          patch -p1 < "${REPO}/patches/nasm-0000-disable-manpages.patch"
          ./configure --prefix=/opt/incus
          make

          mkdir -p /build/target/nasm/
          DESTDIR=/build/target/nasm make install
          rsync -a /build/target/nasm/opt/incus/bin/ /opt/incus/bin/

      - name: Build EDK2
        run: |
          REPO="${PWD}"

          cd /build/edk2
          patch -p1 < "${REPO}/patches/edk2-0001-force-DUID-LLT.patch"
          cp "${REPO}/patches/edk2-0002-logo.bmp" MdeModulePkg/Logo/Logo.bmp
          patch -p1 < "${REPO}/patches/edk2-0003-boot-delay.patch"
          patch -p1 < "${REPO}/patches/edk2-0004-gcc-errors.patch"
          patch -p1 < "${REPO}/patches/edk2-0005-Revert-ArmVirtPkg-make-EFI_LOADER_DATA-non-executabl.patch"
          patch -p1 < "${REPO}/patches/edk2-0006-disable-EFI-memory-attributes-protocol.patch"
          patch -p1 < "${REPO}/patches/edk2-0007-OvmfPkg-X64-add-opt-org-tianocore-UninstallMemAttrProtocol-support.patch"
          patch -p1 < "${REPO}/patches/edk2-0008-Disable-virtio-keyboard.patch"
          patch -p1 < "${REPO}/patches/edk2-9999-disable-UEFI-shell-under-SecureBoot.patch"

          sed -i "s#02/02/2022#$(date +%m/%d/%Y)#g" OvmfPkg/SmbiosPlatformDxe/SmbiosPlatformDxe.c

          EDK2_ARCH="X64"
          EDK2_PKG="OvmfPkg/OvmfPkgX64.dsc"
          EDK2_FV_CODE="OVMF_CODE"
          EDK2_FV_VARS="OVMF_VARS"
          if [ "$(uname -m)" = "aarch64" ]; then
              EDK2_ARCH="AARCH64"
              EDK2_PKG="ArmVirtPkg/ArmVirtQemu.dsc"
              EDK2_FV_CODE="QEMU_EFI"
              EDK2_FV_VARS="QEMU_VARS"
          fi

          build_edk2() {
              TARGET_CODE="$1"
              shift
              TARGET_VARS="$1"
              shift

              set -ex
              (
              cat << EOF
                  . ./edksetup.sh
                  make -C BaseTools ARCH=${EDK2_ARCH}
                  build -a ${EDK2_ARCH} -t GCC -b RELEASE -p ${EDK2_PKG} \
                    -DSMM_REQUIRE=TRUE \
                    -DSECURE_BOOT_ENABLE=TRUE \
                    -DNETWORK_IP4_ENABLE=TRUE \
                    -DNETWORK_IP6_ENABLE=TRUE \
                    -DNETWORK_TLS_ENABLE=TRUE \
                    -DNETWORK_HTTP_BOOT_ENABLE=TRUE \
                    -DTPM2_ENABLE=TRUE \
                    -DTPM2_CONFIG_ENABLE=TRUE \
                    --pcd PcdUninstallMemAttrProtocol=TRUE \
                    $@
          EOF
              ) | bash -e

              cp Build/*/*/FV/${EDK2_FV_CODE}.fd "${TARGET_CODE}"
              cp Build/*/*/FV/${EDK2_FV_VARS}.fd "${TARGET_VARS}"

              if [ "$(uname -m)" = "aarch64" ]; then
                  truncate -s 64m "${TARGET_CODE}"
                  truncate -s 64m "${TARGET_VARS}"
              fi
          }

          mkdir -p "/opt/incus/share/qemu/"
          build_edk2 \
            "/opt/incus/share/qemu/OVMF_CODE.4MB.fd" \
            "/opt/incus/share/qemu/OVMF_VARS.4MB.fd" \
            -DFD_SIZE_4MB

          ln -s OVMF_CODE.4MB.fd /opt/incus/share/qemu/OVMF_CODE.fd
          ln -s OVMF_VARS.4MB.fd /opt/incus/share/qemu/OVMF_VARS.fd

          # Unified (embedded variable store) firmware for AMD SEV.
          if [ "${EDK2_ARCH}" = "X64" ]; then
              touch OvmfPkg/AmdSev/Grub/grub.efi

              (
              cat << EOF
                  . ./edksetup.sh
                  build -a X64 -t GCC -b RELEASE -p OvmfPkg/AmdSev/AmdSevX64.dsc \
                    -DCC_MEASUREMENT_ENABLE=TRUE \
                    -DNETWORK_IP4_ENABLE=TRUE \
                    -DNETWORK_IP6_ENABLE=TRUE \
                    -DNETWORK_TLS_ENABLE=TRUE \
                    -DNETWORK_HTTP_BOOT_ENABLE=TRUE \
                    -DTPM2_ENABLE=TRUE
          EOF
              ) | bash -e

              cp Build/AmdSev/*/FV/OVMF.fd /opt/incus/share/qemu/OVMF.amdsev.fd
          fi

      - name: Build libtpms
        run: |
          REPO="${PWD}"

          cd /build/libtpms
          patch -p1 < "${REPO}/patches/libtpms-0001-Fix-a-compilation-error-in-TPMLIB_GetPlaintext.patch"

          ./autogen.sh
          ./configure --prefix=/opt/incus --with-tpm2 --with-openssl
          make

          mkdir -p /build/target/libtpms/
          DESTDIR=/build/target/libtpms make install
          rsync -a /build/target/libtpms/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/libtpms/opt/incus/lib/ /opt/incus/lib/

      - name: Build swtpm
        run: |
          cd /build/swtpm
          ./autogen.sh
          ./configure --prefix=/opt/incus --with-gnutls --with-seccomp --with-openssl --without-cuse
          make

          mkdir -p /build/target/swtpm/
          DESTDIR=/build/target/swtpm make install
          rsync -a /build/target/swtpm/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/swtpm/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/swtpm/opt/incus/lib/ /opt/incus/lib/

          mkdir -p /opt/incus/etc/
          cat > /opt/incus/etc/swtpm-localca.options << EOF
          --platform-manufacturer Incus
          --platform-version 2.1
          --platform-model QEMU
          EOF

      - name: Build virtiofsd
        run: |
          cd /build/virtiofsd
          cargo build --release
          cp target/release/virtiofsd /opt/incus/bin/

      - name: Build lego
        run: |
          cd /build/lego
          go build -o "/opt/incus/bin/lego" github.com/go-acme/lego/v4/cmd/lego

      - name: Build skopeo
        run: |
          cd /build/skopeo
          go build -o "/opt/incus/bin/skopeo" ./cmd/skopeo

      - name: Build TrueNAS Incus CTL
        run: |
          REPO="${PWD}"

          cd /build/truenas_incus_ctl

          patch -p1 < "${REPO}/patches/truenas-0001-bump-timeouts.patch"

          go build -o "/opt/incus/bin/truenas_incus_ctl" truenas/truenas_incus_ctl

      - name: Build QEMU
        run: |
          REPO="${PWD}"

          cd /build/qemu

          sed -i "s/^unset target_list$/target_list=\"$(uname -m)-softmmu\"/" configure

          sed -i "/subdir('tests')/d" meson.build
          ./configure \
                  --prefix=/opt/incus \
                  --libexecdir=bin \
                  --libdir=lib \
                  --disable-bochs \
                  --disable-cloop \
                  --disable-dmg \
                  --disable-docs  \
                  --disable-fuse  \
                  --disable-guest-agent \
                  --disable-parallels \
                  --disable-qed \
                  --disable-slirp \
                  --disable-user \
                  --disable-vdi \
                  --disable-vnc \
                  --disable-xen \
                  --disable-install-blobs \
                  --enable-attr \
                  --enable-cap-ng \
                  --enable-kvm \
                  --enable-libusb \
                  --enable-usb-redir \
                  --enable-linux-aio \
                  --enable-linux-io-uring \
                  --enable-numa \
                  --enable-pie \
                  --enable-png \
                  --enable-rbd \
                  --enable-seccomp \
                  --enable-spice \
                  --enable-system \
                  --enable-tcg \
                  --enable-tools \
                  --enable-vhost-crypto \
                  --enable-vhost-kernel \
                  --enable-vhost-net \
                  --enable-vhost-user \
                  --enable-virtfs
          make

          mkdir /build/target/qemu/
          DESTDIR=/build/target/qemu/ make install
          rsync -a /build/target/qemu/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/qemu/opt/incus/lib/ /opt/incus/lib/
          rsync -a /build/target/qemu/opt/incus/share/qemu/ /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/kvmvapic.bin /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/vgabios-qxl.bin /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/vgabios-virtio.bin /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-e1000e.rom /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-virtio.rom /opt/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-vmxnet3.rom /opt/incus/share/qemu/

      - name: Build Secure Boot firmware
        run: |
          REPO="${PWD}"

          cd /build/edk2

          FIRMWARE="OVMF"
          if [ "$(uname -m)" = "aarch64" ]; then
            FIRMWARE="AAVMF"
          fi

          cd "${REPO}/edk2-vars-generator"
          ./edk2-vars-generator -f "${FIRMWARE}" \
            -e /build/edk2/Build/*/*/*/EnrollDefaultKeys.efi \
            -s /build/edk2/Build/*/*/*/Shell.efi \
            -c "/opt/incus/share/qemu/OVMF_CODE.4MB.fd" \
            -V "/opt/incus/share/qemu/OVMF_VARS.4MB.fd" \
            -C "$(cat ${REPO}/zabbly-sb.oem.crt)" \
            -o "/opt/incus/share/qemu/OVMF_VARS.4MB.ms.fd"

      - name: Strip and cleanup binaries
        run: |
          rm -Rf /opt/incus/lib/debug/
          rm -Rf /opt/incus/include/
          rm -Rf /opt/incus/lib/pkgconfig/
          rm /opt/incus/lib/*.a /opt/incus/lib/*.la /opt/incus/lib/*/*.a /opt/incus/lib/*/*.la

          rm /opt/incus/bin/nasm
          rm /opt/incus/bin/ndisasm
          rm /opt/incus/bin/qemu-bridge-helper
          rm /opt/incus/bin/qemu-edid
          rm /opt/incus/bin/qemu-io
          rm /opt/incus/bin/qemu-pr-helper
          rm /opt/incus/bin/qemu-storage-daemon
          rm /opt/incus/share/qemu/trace-events-all

          strip /opt/incus/agent/*linux*
          strip /opt/incus/bin/*
          strip /opt/incus/lib/*so*

      - name: Make a Debian package
        env:
          PKGOS: ${{ matrix.os }}
        run: |
          [ "${PKGOS}" = "debian-12" ] && CODENAME=bookworm
          [ "${PKGOS}" = "debian-13" ] && CODENAME=trixie
          [ "${PKGOS}" = "ubuntu-22.04" ] && CODENAME=jammy
          [ "${PKGOS}" = "ubuntu-24.04" ] && CODENAME=noble
          [ "${PKGOS}" = "ubuntu-26.04" ] && CODENAME=resolute

          mkdir -p \
            pkg/ \
            pkg/etc \
            pkg/lib/systemd/system/ \
            pkg/opt/ \
            pkg/usr/bin/ \
            pkg/usr/lib/sysctl.d/ \
            pkg/usr/share/bash-completion/completions/ \
            pkg/usr/share/fish/vendor_completions.d/ \
            pkg/usr/share/zsh/vendor-completions/

          cp -R debian pkg/debian
          cp -R bin/* pkg/usr/bin/
          cp -R /opt/incus pkg/opt/
          cp -R etc/* pkg/etc/

          cp -R systemd/system/* pkg/lib/systemd/system/
          cp -R systemd/wrappers/* pkg/opt/incus/lib/systemd/
          cp -R systemd/sysctl.d/* pkg/usr/lib/sysctl.d/

          ln -s /opt/incus/share/completions/bash pkg/usr/share/bash-completion/completions/incus
          ln -s /opt/incus/share/completions/fish pkg/usr/share/fish/vendor_completions.d/incus.fish
          ln -s /opt/incus/share/completions/zsh pkg/usr/share/zsh/vendor-completions/_incus

          ln -s /opt/incus/bin/fuidshift pkg/usr/bin/fuidshift
          ln -s /opt/incus/bin/incus-simplestreams pkg/usr/bin/incus-simplestreams
          ln -s /opt/incus/bin/incus-benchmark pkg/usr/bin/incus-benchmark

          mkdir -p pkg/var/lib/incus
          chmod 711 pkg/var/lib/incus

          mkdir -p pkg/var/log/incus
          chmod 700 pkg/var/log/incus

          mkdir -p pkg/usr/share/locale
          for i in /opt/incus/share/locale/*.mo; do
            LANG=$(echo $i | sed -e "s#.*/locale/##g" -e "s#.mo\$##g")
            mkdir -p pkg/usr/share/locale/${LANG}/LC_MESSAGES
            ln -s ${i} pkg/usr/share/locale/${LANG}/LC_MESSAGES/incus.mo
          done

          cd pkg

          if [ "${PKGOS}" = "debian-13" ] || [ "${PKGOS}" = "ubuntu-24.04" ] || [ "${PKGOS}" = "ubuntu-26.04" ]; then
            sed -i debian/control \
              -e "s/LIBPNG16/libpng16-16t64/g" \
              -e "s/LIBUSBREDIRPARSER1/libusbredirparser1t64/g" \
              -e "s/LIBAIO1/libaio1t64/g" \
              -e "s/LIBBTRFS0/libbtrfs0t64/g" \
              -e "s/LIBUV1/libuv1t64/g"

            if [ "${PKGOS}" = "ubuntu-26.04" ]; then
              sed -i debian/control \
                -e "s/LIBGPGME11/libgpgme45/g"
            else
              sed -i debian/control \
                -e "s/LIBGPGME11/libgpgme11t64/g"
            fi
          else
            sed -i debian/control \
              -e "s/LIBPNG16/libpng16-16/g" \
              -e "s/LIBUSBREDIRPARSER1/libusbredirparser1/g" \
              -e "s/LIBAIO1/libaio1/g" \
              -e "s/LIBBTRFS0/libbtrfs0/g" \
              -e "s/LIBGPGME11/libgpgme11/g" \
              -e "s/LIBUV1/libuv1/g"
          fi

          if [ "${PKGOS}" = "debian-13" ] || [ "${PKGOS}" = "ubuntu-26.04" ]; then
            sed -i debian/control \
              -e "s/LIBFUSE3/libfuse3-4/g"
          else
            sed -i debian/control \
              -e "s/LIBFUSE3/libfuse3-3/g"
          fi

          if [ "${PKGOS}" = "ubuntu-26.04" ]; then
            sed -i debian/control \
              -e "s/LIBNET1/libnet9/g"
          else
            sed -i debian/control \
              -e "s/LIBNET1/libnet1/g"
          fi

          dch --package incus --create -D ${CODENAME} -M -m "Automated Incus stable build" -v 1:$(echo ${INCUS_TAG} | sed -e "s/v//" -e "s/.0$//")-$(echo ${PKGOS} | sed "s/-//g")-$(date -u +%Y%m%d%H%M) --force-distribution
          dpkg-buildpackage -b

          cd ..
          mkdir out
          mv incus_* out/
          mv incus-base_* out/
          mv incus-client_* out/
          mv incus-extra_* out/
          mv incus-ui-canonical_* out/

      - name: Upload resulting build
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
