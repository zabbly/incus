name: Builds
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-incus:
    name: Build Incus
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        arch:
          - amd64
          - arm64
    runs-on:
      - self-hosted
      - zabbly-incus-build
      - arch-${{ matrix.arch }}
      - image-${{ matrix.os }}

    env:
      OS_ARCH: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os }}
      PKG_CONFIG_PATH: "/opt/incus/lib/pkgconfig/"
      CGO_LDFLAGS: "-L/opt/incus/lib/"
      CGO_CFLAGS: "-I/opt/incus/include/"
      LD_LIBRARY_PATH: "/opt/incus/lib/"
      CPATH: "/opt/incus/include/"
      PATH: "/home/runner/.cargo/bin:/home/runner/.local/bin:/opt/incus/bin:/usr/local/go/bin:/usr/local/node/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin"

      # Linux Containers projects
      DISTROBUILDER_TAG: "distrobuilder-3.2"
      INCUS_TAG: "v6.0.7"
      INCUS_UI_CANONICAL_TAG: "incus-0.23.1.0"
      LXCFS_TAG: "v6.0.6"
      LXC_TAG: "v6.0.6"

      # External dependencies
      COWSQL_TAG: "v1.15.9"
      CRIU_TAG: "v4.3.1"
      EDK2_TAG: "edk2-stable202611"
      GOLANG_TAG: "go1.27.4"
      LEGO_TAG: "v4.35.2"
      LIBTPMS_TAG: "v0.10.2"
      LIBURING_TAG: "liburing-2.15"
      MINIO_MC_TAG: "RELEASE.2025-08-13T08-35-41Z"
      MINIO_TAG: "RELEASE.2025-10-15T17-29-55Z"
      NASM_TAG: "nasm-2.16.03"
      NVIDIA_CONTAINER_TAG: "v1.20.2"
      QEMU_TAG: "v9.0.4"
      RAFT_TAG: "v0.22.1"
      SEABIOS_TAG: "rel-1.17.0"
      SWTPM_TAG: "v0.10.2"
      VIRTIOFSD_TAG: "v1.15.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global --add advice.detachedHead false
          git config --global user.email "noreply@zabbly.com"
          git config --global user.name "Zabbly Incus build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            acpica-tools \
            asciidoc \
            autoconf \
            automake \
            bison \
            bmake \
            build-essential \
            curl \
            debhelper \
            devscripts \
            dosfstools \
            expect \
            flex \
            gawk \
            gettext \
            gnutls-bin \
            gnutls-dev \
            git \
            iproute2 \
            libacl1-dev \
            libaio-dev \
            libapparmor-dev \
            libcap-dev \
            libcap-ng-dev \
            libdbus-1-dev \
            libelf-dev \
            libfuse3-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            libjson-glib-dev \
            libnet1-dev \
            libnl-3-dev \
            libnuma-dev \
            libpam0g-dev \
            libpixman-1-dev \
            libpng-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            librbd-dev \
            libseccomp-dev \
            libselinux1-dev \
            libspice-server-dev \
            libsqlite3-dev \
            libssl-dev \
            libsystemd-dev \
            libtirpc-dev \
            libtool \
            libudev-dev \
            libusb-1.0-0-dev \
            libusbredirhost-dev \
            libuv1-dev \
            lsb-release \
            mtools \
            ninja-build \
            pipx \
            pkg-config \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-cryptography \
            python3-jinja2 \
            python3-pexpect \
            python3-pip \
            python3-setuptools \
            python3-tomli \
            python3-venv \
            rsync \
            socat \
            uuid-dev \
            xmlto \
            xorriso

          sudo apt-get install --no-install-recommends --yes systemd-dev || true

          pipx install meson

      - name: Install Go
        run: |
          curl -sL "https://go.dev/dl/${GOLANG_TAG}.linux-${OS_ARCH}.tar.gz" | sudo tar -C /usr/local/ -zx
          go version

      - name: Install Rust
        run: |
          curl -sL https://sh.rustup.rs -o install-rust.sh
          bash install-rust.sh -y

      - name: Install Node
        run: |
          [ "${OS_ARCH}" = "amd64" ] && NODE_ARCH=x64
          [ "${OS_ARCH}" = "arm64" ] && NODE_ARCH=arm64


          sudo mkdir /usr/local/node/
          curl -sL "https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-${NODE_ARCH}.tar.xz" | sudo tar -C /usr/local/node/ -Jx --strip-components=1

      - name: Build environment
        run: |
          sudo mkdir -p /build/ /opt/
          sudo chown $(id -u):$(id -g) /build/ /opt/

          mkdir -p \
            /opt/incus/bin/ \
            /opt/incus/include/ \
            /opt/incus/lib/ \
            /opt/incus/lib/systemd \
            /opt/incus/share/

      - name: Get the code
        run: |
          PIDS=""
          bg() {
              "$@" &
              PIDS="${PIDS} $!"
          }

          bg git clone https://github.com/lxc/distrobuilder /build/distrobuilder --depth 1 -b "${DISTROBUILDER_TAG}"
          bg git clone https://github.com/lxc/lxc /build/lxc -b "${LXC_TAG}"
          bg git clone https://github.com/lxc/lxcfs /build/lxcfs --depth 1 -b "${LXCFS_TAG}"
          bg git clone https://github.com/lxc/incus /build/incus -b "${INCUS_TAG}"
          bg git clone https://github.com/zabbly/incus-ui-canonical /build/incus-ui-canonical --depth 1 -b "${INCUS_UI_CANONICAL_TAG}"

          bg git clone https://github.com/axboe/liburing /build/liburing --depth 1 -b "${LIBURING_TAG}"
          bg git clone https://github.com/checkpoint-restore/criu /build/criu --depth 1 -b "${CRIU_TAG}"
          bg git clone https://github.com/cowsql/cowsql /build/cowsql --depth 1 -b "${COWSQL_TAG}"
          bg git clone https://github.com/cowsql/raft /build/raft --depth 1 -b "${RAFT_TAG}"
          bg git clone https://github.com/go-acme/lego /build/lego --depth 1 -b "${LEGO_TAG}"
          bg git clone https://github.com/minio/mc /build/mc --depth 1 -b "${MINIO_MC_TAG}"
          bg git clone https://github.com/minio/minio /build/minio --depth 1 -b "${MINIO_TAG}"
          bg git clone https://github.com/NVIDIA/libnvidia-container /build/libnvidia-container --depth 1 -b "${NVIDIA_CONTAINER_TAG}"
          bg git clone https://github.com/stefanberger/libtpms /build/libtpms --depth 1 -b "${LIBTPMS_TAG}"
          bg git clone https://github.com/stefanberger/swtpm /build/swtpm --depth 1 -b "${SWTPM_TAG}"
          bg git clone https://github.com/tianocore/edk2 /build/edk2 --recurse-submodules --shallow-submodules --depth 1 -b "${EDK2_TAG}"
          bg git clone https://gitlab.com/qemu-project/qemu /build/qemu --depth 1 -b "${QEMU_TAG}"
          bg git clone https://gitlab.com/qemu-project/seabios /build/seabios --depth 1 -b "${SEABIOS_TAG}"
          bg git clone https://gitlab.com/virtio-fs/virtiofsd /build/virtiofsd --depth 1 -b "${VIRTIOFSD_TAG}"

          mkdir /build/nasm/
          curl -sL "https://www.nasm.us/pub/nasm/releasebuilds/$(echo ${NASM_TAG} | cut -d- -f2)/${NASM_TAG}.tar.gz" --resolve www.nasm.us:443:198.137.202.136 | tar -C /build/nasm/ -zx --strip-components=1 &
          PIDS="${PIDS} $!"

          for pid in ${PIDS}; do
              wait "${pid}"
          done

      - name: Build liburing
        run: |
          cd /build/liburing
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/liburing/
          DESTDIR=/build/target/liburing make install
          rsync -a /build/target/liburing/opt/incus/include/* /opt/incus/include/
          rsync -a /build/target/liburing/opt/incus/lib/* /opt/incus/lib/

      - name: Build raft
        run: |
          cd /build/raft
          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/raft/
          DESTDIR=/build/target/raft/ make install
          rsync -a /build/target/raft/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/raft/opt/incus/lib/ /opt/incus/lib/

      - name: Build cowsql
        run: |
          REPO="${PWD}"

          cd /build/cowsql
          patch -p1 < "${REPO}/patches/cowsql-0001-discarded-qualifiers.patch"

          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/cowsql/
          DESTDIR=/build/target/cowsql/ make install
          rsync -a /build/target/cowsql/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/cowsql/opt/incus/lib/ /opt/incus/lib/

      - name: Build LXC
        run: |
          REPO="${PWD}"

          cd /build/lxc

          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Dexamples=false \
                  -Dman=false \
                  -Dtools=false \
                  -Dtests=false \
                  -Dmemfd-rexec=false \
                  -Dapparmor=true \
                  -Dseccomp=true \
                  -Dselinux=true \
                  -Dcapabilities=true \
                  -Dio-uring-event-loop=false
          meson compile -C build

          mkdir -p /build/target/lxc/
          DESTDIR=/build/target/lxc/ meson install -C build
          rsync -a /build/target/lxc/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/lxc/opt/incus/lib/ /opt/incus/lib/
          mkdir -p /opt/incus/share/lxc/config/common.conf.d/
          mkdir -p /opt/incus/share/lxc/hooks/
          cp /build/target/lxc/opt/incus/share/lxc/hooks/nvidia /opt/incus/share/lxc/hooks/

      - name: Build LXCFS
        run: |
          REPO="${PWD}"

          cd /build/lxcfs
          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Ddocs=false \
                  -Dtests=false
          meson compile -C build

          mkdir -p /build/target/lxcfs/
          DESTDIR=/build/target/lxcfs/ meson install -C build
          rsync -a /build/target/lxcfs/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/lxcfs/opt/incus/share/ /opt/incus/share/
          rsync -a /build/target/lxcfs/opt/incus/lib/ /opt/incus/lib/

          sed -i "s#/var/lib/lxcfs#/var/lib/incus-lxcfs#g" /opt/incus/share/lxcfs/lxc.mount.hook
          patch -p1 /opt/incus/share/lxcfs/lxc.mount.hook < "${REPO}/patches/lxcfs-0001-hook.patch"

      - name: Build Incus
        run: |
          REPO="${PWD}"

          cd /build/incus

          git cherry-pick 7518d5c09212403d871499ef855d244d60162508  # incusd/instance/lxc: Keep loader variables out of the forklxc environment
          git cherry-pick 8ac34ea2e432f67757c7dd62205c722dff8a629d  # incusd: Check resource creation against the effective project
          git cherry-pick ecccdd82716b899882e67ec17e7a81b23171ed55  # incusd/auth/tls: Restrict inherited reads to the certificate's projects
          git cherry-pick c3d99b1cb96c76b809a18bd9f8ac7b7ab268d6de  # incusd/operations: Protect token operations from events and cancellation
          git cherry-pick 18de390da967f4d928b6a7dea67aa8179a379067  # incusd/storage: Validate snapshot names from the backup index on import
          git cherry-pick 1031796be7728d36ce9b59bdb3312e48c2cb4aed  # incusd: Only trust the key-proven client certificate
          git cherry-pick 50cb73e17e22a51f0f1517285795638c29cf9923  # incusd/dev_incus: Pin image export to the instance's project
          git cherry-pick f02ae798d9aa07bfdbc0dbbb4f1169a72d1764dc  # incusd/events: Restrict network-acl events to privileged viewers
          git cherry-pick f713b5d57b6857c662371f398f9450f2c8f6f64d  # incusd/operations: Keep websocket secrets out of events and queries
          git cherry-pick 1319c047bab4ddc4710c9a8ccbf2e834bc1bb2c7  # incusd/instance/lxc: Allocate an idmap when none is set at start
          git cherry-pick 0f0611363876fcfb99ce0483d46f9b9c59660ed3  # incusd: Fix cross-project disclosure in recursive and all-projects listings
          git cherry-pick 5c95c34fc4cb1f722193ded087adf8682570a8d2  # incusd/storage: Strip non-regular files from instance metadata
          git cherry-pick 0e8f8635b873e588c3e7a1e6eef88eb18c8bea2e  # incusd: Reject null snapshot entries on backup import
          git cherry-pick a985b8ec80b4645064cfb099322f6e9a9a0e8199  # incusd: Authorize effective project on resource creation
          git cherry-pick 0dc65cba78bd9c8da636b418e85d082f76294ad4  # incusd/instance/qemu: Confine NBD migration sockets to the run directory
          git cherry-pick ae25b82a1e2f1077643830ad56f62a975ba13b3d  # github: Fix linux-modules-extra installation
          git cherry-pick da1be1fc2d1b921237aa5e1c9f4c90ceb7163823  # incusd/storage/btrfs: Skip quotas on ISO volumes
          git cherry-pick 7f249375baee745a06b239eca87fb43ef28968ab  # incusd: Check certificate ownership on every non-admin update
          git cherry-pick ca0edc34b58832734fe28ae58e8f64f6957547e2  # incusd/auth/tls: Only inherit default project objects through a project using them
          git cherry-pick 23016e76ad1b51a2616fe76455bdb3c5ee562d67  # incusd/operations: Strip the state secret from renders too
          git cherry-pick 13528d3baaa376faeff2217a7bff903f3b270a2e  # incusd: Limit non-streaming bodies on large request endpoints
          git cherry-pick e8b83d450122afc28f06ffcc6b0cad4cd88db5ac  # incusd: Forbid push mode migration in restricted projects
          git cherry-pick 58e7173015a1ca847e0497158d81bfac04c0b4ca  # incusd/migration: Bound the size of protocol messages
          git cherry-pick a3025a05111326de06afe53d9169a56a5b7ca2dd  # incusd/instance/qemu: Reject quotes and line breaks in qemu.conf values
          git cherry-pick fcacdf635a0d6bf81b075cc25a108cc8cb2b3dbb  # incusd/device/tpm: Read device numbers from sysfs
          git cherry-pick 6debba48bf060877b55cfbe8b0cf87d3217bb28b  # incusd/device/nic_bridged: Restrict host-side routes in restricted projects
          git cherry-pick 7bbbe70ddff51af7c63f7113b37571c57a1c13d5  # incusd/storage: Validate snapshot names received through migration
          git cherry-pick b2837791f21da8b896cfa390864cc88d8c7147a3  # incusd/metrics: Escape label values
          git cherry-pick 6e86eed5e7fcb09ac37c3e34a95bdbda7e7f056d  # incusd/instances: Enforce restricted.snapshots on copy, migration and import
          git cherry-pick fc012a05d57680d7a7cdcaadf5cfcbe01de13412  # incusd/storage: Reject a symlinked block file when unpacking backups and images
          git cherry-pick 9fb1ae9aea8f76ffdcf05f23d682c4824158554f  # incusd/instance/lxc: Enable the devices cgroup for all containers
          git cherry-pick 79b2b509ca170c28f5e8b07a058cf795c8758d09  # incusd: Ignore client-supplied forwarded requestor headers
          git cherry-pick 30a12a75d2188d310589ce0cba6f99785628f50d  # incusd: Block remote clients during startup
          git cherry-pick 1e67294f6aafd19a99cd3e8a6126611e69c6a2bb  # incusd: Don't let the owner re-key a CA-trusted restricted certificate
          git cherry-pick 8fe61fc7640f6a926cdb8ad3543c49c63c1982e0  # incusd: Don't resolve locale or NSS modules from the instance
          git cherry-pick 1cdbbbe4eb91f8eb3b729ab0619b78f426b21aca  # incusd: Don't leak descriptors into the intercepted mount.fuse
          git cherry-pick a9f3680cf08ce7b7372736650f744eec4fbd3033  # incusd/rsync: Only accept the rsync helper on the transfer socket
          git cherry-pick 8d92cbbf614cc7585c4909afe4b2978c46b4406a  # incusd: Harden forkproxy unix socket handling
          git cherry-pick df90ec3ae9355b94e62012d4300c89b3e6aefb47  # incusd/seccomp: Validate the notification before acting on mknod
          git cherry-pick 3ef2fa74e9b5f12d4426ca03360bd5eff40ff21a  # incusd: Lock read-only on hot-plugged idmapped disks
          git cherry-pick ac7b6a12c583df70fef09b6955cb72908f183965  # incusd/storage: Resolve bucket backup before export
          git cherry-pick 8b86fe879e442a6e5cba7297f078b4d3cd95cfff  # incusd: Validate the image fingerprint before recording it
          git cherry-pick 356a18f5e5f5527a396be4bafdf3726fc6be3588  # incusd/storage: Validate initial.mode as an octal mode
          git cherry-pick 8c227e97907e8360230f3f979c8c34eea336c454  # incusd: Restrict image delta base to an owned fingerprint
          git cherry-pick a882a59ef2a63db8becf5a1daaeebc69db5ae86c  # incusd: Lock the instance during rename
          git cherry-pick e3ea72d9be9977f015a0515f4eb07b2cbfa524fc  # incusd/storage: Reject rootfs content in a split image metadata tarball
          git cherry-pick 1693dcb0b0d1262f2f49b9e9d3eb1e2258897df8  # incusd/device: Reject ".." components in device mount paths
          git cherry-pick 35e3a12fbc54c5b319aee3a4e46a2f61f1ac161a  # incusd/device: Mount disk staging bind mounts nosuid
          git cherry-pick ea31f2aa1cd855e5cfcd3233b48515c0e6502fc3  # incusd/storage: Reject non-self-contained VM images on unpack
          git cherry-pick 3f89b6e0e51517c13d74ab2dca26f09c72e7fb81  # incusd/device: Forbid guest root on restricted VM disk shares
          git cherry-pick 733953b45b854e59917634daf641051e2271241d  # incusd/project: Forbid raw.idmap mapping onto container root in restricted projects
          git cherry-pick 2eda10be3dbdf20d436a41535b3bb401994e9507  # incusd/project: Fail closed when the checked profile or instance is gone
          git cherry-pick 2e46cc24dbffaada92aa64dd504ce539543df2cc  # incusd: Serialize instance rewrites on volume rename and profile update
          git cherry-pick 976727f6c89274efda6e67f17ba7052b85f41330  # incusd/instance: Return a copy of the local config from Render
          git cherry-pick 037b2ab3a55788d96bdaa12d6d5bbc9b1d959a15  # incusd: Check project restrictions after the move pool override
          git cherry-pick 4b082e9c4dd62d5509e742f7ae51cefd9a9c1050  # incusd: Keep the imported root disk on the import pool
          git cherry-pick 4b841b3ca9a3f2c3879af32d890abd15f57f734e  # incusd/instance/qemu: Keep secrets out of the QMP log
          git cherry-pick e41c5f172ce8fe1c68ff912465a669339372ed53  # incusd/storage: Validate bucket key names and credentials
          git cherry-pick c66a86810c44d34f906e453c5cc646cda0d67fb6  # incusd: Validate instance and bucket backup names
          git cherry-pick a95b0cb6ae2794981268be35b6a1f803bb4c3fce  # incusd: Don't follow a symlinked exec output directory
          git cherry-pick e216fa7d106eceaa8a1d987fc82ab9fe7272bfda  # incusd: Migrate the requested volume on a cross-member move
          git cherry-pick 855bebe65bbb4ede20c5bd6634f0acc02509dcb7  # incusd: Require edit access on the target of a refresh
          git cherry-pick f96424a09be2a5ae9cf9248af9955cf1d9cc3b71  # incusd: Only restore an instance from its own snapshots
          git cherry-pick 99143c0622e3f63f212b1bc0a92363666a6c64e0  # incusd/project: Keep container runtime state out of restricted projects
          git cherry-pick ae1a99b576635096efa674807adb6a78dd24f327  # incusd/device: Check the interface an instance hands back
          git cherry-pick a893cf34d65ee6ffe57ab58bed0d83bc6a0c4ee2  # incusd/device: Count NICs on managed networks as VLAN interface users
          git cherry-pick 14739d97dc1f295d7e68cdf5e40a2f2212ecec06  # incusd/network/ovn: Forbid host interfaces and tunnels in restricted projects
          git cherry-pick 074ee607aae96aa96c1597d28a2afcd6114cc2d7  # incusd/network: Keep long VLAN interface names unique per parent
          git cherry-pick f1048cb61048b064d0153fca4dafed1f7bec48de  # incusd/storage: Keep the full name on loaded bucket backups
          git cherry-pick 9560d36f8580d144a53996d5ead3fed0e0911d98  # incusd: Only reuse public images from other projects on refresh
          git cherry-pick e922a410f7f039be2b0af36b2770b5bd816afd5d  # incusd: Limit image token callers to the raw upload
          git cherry-pick 92268e03995fa08b5ecbf3a8b36ca334b81c5bf7  # client/oci: Fingerprint the manifest and pin the copy to it
          git cherry-pick 2241e9c9e2376cbe1f6a34513f28fdcd948fc8f6  # incusd: Store downloaded images under the hash of their content
          git cherry-pick b06c1ab70f4f69c386cc9130bcfd0e9b6280a22d  # incusd/network: Check the client ID length when parsing leases
          git cherry-pick 4c9c5599222a4ab549781198deeff77f2e09d553  # incusd/images: Use the reused image's fingerprint on transfer
          git cherry-pick 3feb3a82131da5e1e6dead8d7b87e08db4a6ae6d  # incusd: Reject template entries without a definition
          git cherry-pick 904b370cf0c40bf8ad7ef233854315793cd4935a  # incusd/images: Create the properties map when the metadata has none
          git cherry-pick 920f773cc6f8fe9e923c3ba273bfbc388ba72540  # incusd: Create the expanded config map on backup import
          git cherry-pick efb275c8b8c29a16983e3b38bc34f669034b9d85  # shared/ws: Stop reading a websocket once a read failed
          git cherry-pick b956087ba75c55da831110eb48137791f54befd7  # incusd: Validate the syscall allow and deny lists
          git cherry-pick 4e0bf3dbed7e8fe0cc4d2d46fe296b0310a2a360  # incusd: Forbid backup upload targets in restricted projects
          git cherry-pick 96d492badf56480479281c03e1810347e2c83bd1  # incusd/images: Check the export target against the project's image servers
          git cherry-pick 5ee662005b45e75ed889a03e9e2a5879c0313e15  # incusd/firewall: Drop unwanted frames before the bridge filter accepts
          git cherry-pick 674df127d9a9524ee5fdf8eafb66fee02c955b22  # incusd/project: Reject a negative limits.processes in the aggregate check
