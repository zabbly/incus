name: Builds
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-incus:
    name: Build Incus
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        arch:
          - amd64
          - arm64
    runs-on:
      - self-hosted
      - zabbly-incus-build
      - arch-${{ matrix.arch }}
      - image-${{ matrix.os }}

    env:
      OS_ARCH: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os }}
      PKG_CONFIG_PATH: "/opt/incus/lib/pkgconfig/"
      CGO_LDFLAGS: "-L/opt/incus/lib/"
      CGO_CFLAGS: "-I/opt/incus/include/"
      LD_LIBRARY_PATH: "/opt/incus/lib/"
      CPATH: "/opt/incus/include/"
      PATH: "/home/runner/.cargo/bin:/home/runner/.local/bin:/opt/incus/bin:/usr/local/go/bin:/usr/local/node/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin"

      # Linux Containers projects
      DISTROBUILDER_TAG: "distrobuilder-3.2"
      INCUS_COMPOSE_TAG: "v1.3.4"
      INCUS_TAG: "v7.5.1"
      INCUS_UI_CANONICAL_TAG: "incus-0.21.7"
      LXCFS_TAG: "v7.0.0"
      LXC_TAG: "v7.0.0"

      # External dependencies
      COWSQL_TAG: "v1.15.9"
      CRIU_TAG: "v4.2.1"
      EDK2_TAG: "edk2-stable202608"
      GOLANG_TAG: "go1.27.2"
      LEGO_TAG: "v4.35.2"
      LIBTPMS_TAG: "v0.10.2"
      LIBURING_TAG: "liburing-2.15"
      NASM_TAG: "nasm-2.16.03"
      NVIDIA_CONTAINER_TAG: "v1.20.1"
      QEMU_TAG: "v11.1.2"
      RAFT_TAG: "v0.22.1"
      SEABIOS_TAG: "rel-1.17.0"
      SKOPEO_TAG: "v1.24.1"
      SWTPM_TAG: "v0.10.2"
      TRUENAS_INCUS_CTL_TAG: "v0.7.7"
      VIRGLRENDERER_TAG: "1.3.0"
      VIRTIOFSD_TAG: "v1.14.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global --add advice.detachedHead false
          git config --global user.email "noreply@zabbly.com"
          git config --global user.name "Zabbly Incus build"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            acpica-tools \
            asciidoc \
            autoconf \
            automake \
            bison \
            bmake \
            build-essential \
            curl \
            debhelper \
            devscripts \
            dosfstools \
            expect \
            flex \
            gawk \
            gettext \
            gnutls-bin \
            gnutls-dev \
            git \
            iproute2 \
            libacl1-dev \
            libaio-dev \
            libapparmor-dev \
            libbtrfs-dev \
            libcap-dev \
            libcap-ng-dev \
            libdbus-1-dev \
            libdevmapper-dev \
            libelf-dev \
            libfuse3-dev \
            libglib2.0-dev \
            libgnutls28-dev \
            libgpgme-dev \
            libjson-glib-dev \
            libnet1-dev \
            libnl-3-dev \
            libnuma-dev \
            libpam0g-dev \
            libpixman-1-dev \
            libpng-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            librbd-dev \
            libseccomp-dev \
            libselinux1-dev \
            libspice-server-dev \
            libsqlite3-dev \
            libssl-dev \
            libsystemd-dev \
            libtirpc-dev \
            libtool \
            libudev-dev \
            libusb-1.0-0-dev \
            libusbredirhost-dev \
            libuv1-dev \
            lsb-release \
            mtools \
            ninja-build \
            pipx \
            pkg-config \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-cryptography \
            python3-jinja2 \
            python3-pexpect \
            python3-pip \
            python3-setuptools \
            python3-tomli \
            python3-venv \
            rsync \
            socat \
            uuid-dev \
            xmlto \
            xorriso

          if [ "${OS_NAME}" = "debian-13" ] || [ "${OS_NAME}" = "ubuntu-26.04" ]; then
            sudo apt-get install --no-install-recommends --yes \
                libdrm-dev \
                libegl1-mesa-dev \
                libgbm-dev \
                libepoxy-dev
          fi

          sudo apt-get install --no-install-recommends --yes systemd-dev || true

          pipx install meson

      - name: Install Go
        run: |
          curl -sL "https://go.dev/dl/${GOLANG_TAG}.linux-${OS_ARCH}.tar.gz" | sudo tar -C /usr/local/ -zx
          go version

      - name: Install Rust
        run: |
          curl -sL https://sh.rustup.rs -o install-rust.sh
          bash install-rust.sh -y

      - name: Install Node
        run: |
          [ "${OS_ARCH}" = "amd64" ] && NODE_ARCH=x64
          [ "${OS_ARCH}" = "arm64" ] && NODE_ARCH=arm64


          sudo mkdir /usr/local/node/
          curl -sL "https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-${NODE_ARCH}.tar.xz" | sudo tar -C /usr/local/node/ -Jx --strip-components=1

      - name: Build environment
        run: |
          sudo mkdir -p /build/ /opt/
          sudo chown $(id -u):$(id -g) /build/ /opt/

          mkdir -p \
            /opt/incus/bin/ \
            /opt/incus/include/ \
            /opt/incus/lib/ \
            /opt/incus/lib/systemd \
            /opt/incus/share/

      - name: Get the code
        run: |
          PIDS=""
          bg() {
              "$@" &
              PIDS="${PIDS} $!"
          }

          bg git clone https://github.com/lxc/distrobuilder /build/distrobuilder --depth 1 -b "${DISTROBUILDER_TAG}"
          bg git clone https://github.com/lxc/lxc /build/lxc -b "${LXC_TAG}"
          bg git clone https://github.com/lxc/lxcfs /build/lxcfs --depth 1 -b "${LXCFS_TAG}"
          bg git clone https://github.com/lxc/incus /build/incus -b "${INCUS_TAG}"
          bg git clone https://github.com/lxc/incus-compose /build/incus-compose --depth 1 -b "${INCUS_COMPOSE_TAG}"
          bg git clone https://github.com/zabbly/incus-ui-canonical /build/incus-ui-canonical --depth 1 -b "${INCUS_UI_CANONICAL_TAG}"

          bg git clone https://github.com/axboe/liburing /build/liburing --depth 1 -b "${LIBURING_TAG}"
          bg git clone https://github.com/checkpoint-restore/criu /build/criu --depth 1 -b "${CRIU_TAG}"
          bg git clone https://github.com/containers/skopeo /build/skopeo --depth 1 -b "${SKOPEO_TAG}"
          bg git clone https://github.com/cowsql/cowsql /build/cowsql --depth 1 -b "${COWSQL_TAG}"
          bg git clone https://github.com/cowsql/raft /build/raft --depth 1 -b "${RAFT_TAG}"
          bg git clone https://github.com/go-acme/lego /build/lego --depth 1 -b "${LEGO_TAG}"
          bg git clone https://github.com/NVIDIA/libnvidia-container /build/libnvidia-container --depth 1 -b "${NVIDIA_CONTAINER_TAG}"
          bg git clone https://github.com/stefanberger/libtpms /build/libtpms --depth 1 -b "${LIBTPMS_TAG}"
          bg git clone https://github.com/stefanberger/swtpm /build/swtpm --depth 1 -b "${SWTPM_TAG}"
          bg git clone https://github.com/tianocore/edk2 /build/edk2 --recurse-submodules --shallow-submodules --depth 1 -b "${EDK2_TAG}"
          bg git clone https://github.com/truenas/truenas_incus_ctl /build/truenas_incus_ctl --depth 1 -b "${TRUENAS_INCUS_CTL_TAG}"
          bg git clone https://gitlab.com/qemu-project/qemu /build/qemu --depth 1 -b "${QEMU_TAG}"
          bg git clone https://gitlab.com/qemu-project/seabios /build/seabios --depth 1 -b "${SEABIOS_TAG}"
          bg git clone https://gitlab.com/virtio-fs/virtiofsd /build/virtiofsd --depth 1 -b "${VIRTIOFSD_TAG}"

          if [ "${OS_NAME}" = "debian-13" ] || [ "${OS_NAME}" = "ubuntu-26.04" ]; then
            bg git clone https://gitlab.freedesktop.org/virgl/virglrenderer /build/virglrenderer --depth 1 -b "${VIRGLRENDERER_TAG}"
          fi

          mkdir /build/nasm/
          curl -sL "https://www.nasm.us/pub/nasm/releasebuilds/$(echo ${NASM_TAG} | cut -d- -f2)/${NASM_TAG}.tar.gz" --resolve www.nasm.us:443:198.137.202.136 | tar -C /build/nasm/ -zx --strip-components=1 &
          PIDS="${PIDS} $!"

          for pid in ${PIDS}; do
              wait "${pid}"
          done

      - name: Build liburing
        run: |
          cd /build/liburing
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/liburing/
          DESTDIR=/build/target/liburing make install
          rsync -a /build/target/liburing/opt/incus/include/* /opt/incus/include/
          rsync -a /build/target/liburing/opt/incus/lib/* /opt/incus/lib/

      - name: Build raft
        run: |
          cd /build/raft
          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/raft/
          DESTDIR=/build/target/raft/ make install
          rsync -a /build/target/raft/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/raft/opt/incus/lib/ /opt/incus/lib/

      - name: Build cowsql
        run: |
          REPO="${PWD}"

          cd /build/cowsql
          patch -p1 < "${REPO}/patches/cowsql-0001-discarded-qualifiers.patch"

          autoreconf -i
          ./configure --prefix=/opt/incus
          make -j"$(nproc)"

          mkdir -p /build/target/cowsql/
          DESTDIR=/build/target/cowsql/ make install
          rsync -a /build/target/cowsql/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/cowsql/opt/incus/lib/ /opt/incus/lib/

      - name: Build LXC
        run: |
          REPO="${PWD}"

          cd /build/lxc

          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Dexamples=false \
                  -Dman=false \
                  -Dtools=false \
                  -Dtests=false \
                  -Dmemfd-rexec=false \
                  -Dapparmor=true \
                  -Dseccomp=true \
                  -Dselinux=true \
                  -Dcapabilities=true \
                  -Dio-uring-event-loop=false
          meson compile -C build

          mkdir -p /build/target/lxc/
          DESTDIR=/build/target/lxc/ meson install -C build
          rsync -a /build/target/lxc/opt/incus/include/ /opt/incus/include/
          rsync -a /build/target/lxc/opt/incus/lib/ /opt/incus/lib/
          mkdir -p /opt/incus/share/lxc/config/common.conf.d/
          mkdir -p /opt/incus/share/lxc/hooks/
          cp /build/target/lxc/opt/incus/share/lxc/hooks/nvidia /opt/incus/share/lxc/hooks/

      - name: Build LXCFS
        run: |
          REPO="${PWD}"

          cd /build/lxcfs
          meson setup build \
                  --prefix=/opt/incus \
                  --libdir=/opt/incus/lib \
                  -Ddocs=false \
                  -Dtests=false
          meson compile -C build

          mkdir -p /build/target/lxcfs/
          DESTDIR=/build/target/lxcfs/ meson install -C build
          rsync -a /build/target/lxcfs/opt/incus/bin/ /opt/incus/bin/
          rsync -a /build/target/lxcfs/opt/incus/share/ /opt/incus/share/
          rsync -a /build/target/lxcfs/opt/incus/lib/ /opt/incus/lib/

          sed -i "s#/var/lib/lxcfs#/var/lib/incus-lxcfs#g" /opt/incus/share/lxcfs/lxc.mount.hook
          patch -p1 /opt/incus/share/lxcfs/lxc.mount.hook < "${REPO}/patches/lxcfs-0001-hook.patch"

      - name: Build Incus
        run: |
          REPO="${PWD}"

          cd /build/incus

          git cherry-pick 40bf41895abbdccfbad12b57e114e1a46a944716  # devcontainer: bump Go to 1.26
          git cherry-pick 10c2c1f460b8fbf82d31b295cf775612aa690a2e  # incus/server/instance/drivers/qemu: dont interpret ErrNonReusuableSucceeded as error
          git cherry-pick 2fd03fac717783fd57ad81f0a14a723b96ef20ff  # incus/server/instance/drivers/lxc: dont interpret ErrNonReusuableSucceeded as error
          git cherry-pick 8f8d84d8190b100571d6efb666451f9770e64d5e  # doc: Move warning for macOS in howto/insntances_create
          git cherry-pick e8d26c575383e456097862e426df3d27dbcfcc79  # incusd/instance/lxc: Use IsRootDiskDevice in diskState
          git cherry-pick a217ce2ce2068f29db6a91202ac2f991cf51edee  # incusd/instance/qemu: Report disk usage for all disk devices in state
          git cherry-pick 4acef387fff774c1ea8403bb7ce920c673a0c9de  # incusd/instance: Resolve the custom volume project in diskState
          git cherry-pick fdbad000e78bd98e1a77f4fad420302c0b4feacc  # shared/tls: Add PublicKeyChain
          git cherry-pick daf9728b6331547f75d78631a4bef448bb86dc41  # shared/tls: Add GetRemoteCertificates
          git cherry-pick 183c1d195920130e2063e0d318bec626c9b7ae9b  # incusd/endpoints: Return the full certificate chain from NetworkPublicKey
          git cherry-pick 870a2963d9a138a22a3f13077a3e1a43b4913dda  # incusd: Sync the full cluster certificate chain from the leader
          git cherry-pick 8bb2ecac4bd018e211f1ccf10397c3ddd8ee5713  # tests: Cover joining with a cluster certificate chain
          git cherry-pick 6801fbf9e98c149385ca91dc84484425df31b3c1  # incusd/mirror: Never follow symlinks in mirrored directories
          git cherry-pick 175121c0d584d6d63dc2cf66ebbab7a6f70a9ba9  # incusd/instance/qemu: Seed NVRAM from the real file rather than its symlink
          git cherry-pick 1b2d7aa8216749632f9b8a5f3d20d3ca402ed241  # incusd/device/tpm: Refuse a state path that isn't a real directory
          git cherry-pick 3ee36eda4afd0f9940bae1c1ca7c6774ca887a15  # incus/image: Sort properties in image info
          git cherry-pick 2cb2549252b0551561f6e7e7afdb153947a3d290  # incusd/endpoints: Don't block the local accept loop on the STARTTLS peek
          git cherry-pick f0a17a33bb28075848faa917591501a5a351a38d  # incusd/networks: Fix start priority of networks with a parent
          git cherry-pick 29a4e8667b087fdddf46c827b2182d2c0de9ae76  # tests: Make the sparse file test independent of the page size
          git cherry-pick 659042d438b06cee4596e846835776176b178e66  # incusd/instance/qemu: Allow live-update of security.tags
          git cherry-pick 9f256ccf76e5a30190cb423992ebfe1821d00ac1  # incus: Allow building for NetBSD
          git cherry-pick 009cd6ec2663a8e2c58b8ade2205db8a1c945e56  # Revert "goreleaser: Temporarily disable netbsd artifacts"
          git cherry-pick 20e62adfc8d670d180c298b517151159fcacc50e  # Update gomod
          git cherry-pick 75ff144dc9a095944a33688e053ecc31b4fff740  # incusd: Allow the server certificate update over HTTPS
          git cherry-pick 81e2ded4f88d7b29c0edf50481a89f1623535853  # incus/admin: Support remotes in update-certificate
          git cherry-pick a1c7dee7ee130744fd50be7b0ed39e03736bdb73  # incusd/instance: Fix nil dereference in canMigrate on device load error
          git cherry-pick bf964be1544b671cde63dc572c731b4f0332d8b4  # incusd/instance: Only let a migration inherit its own lock when stopping
          git cherry-pick cb6efa761abb7e61bb9714c2b86785c4e023a701  # incusd/instance: Wait for state changes before migrating
          git cherry-pick 28ffc69fb721c1729967a2f6712f232c22553eef  # incusd/instance: Don't fail a move on source cleanup errors
          git cherry-pick aa7b47e27649ab147ce6a163f261b3db8809bd06  # incusd/instance/qmp: Add agent TEMPLATED status
          git cherry-pick a1fb42b459385975149940f452738e022cd19769  # incusd/instance/qemu: Clear template state when the agent reports applying them
          git cherry-pick 4e799f72871b11c6c168659930b866476a8b5121  # incus-agent: Report template application before rebooting for cloud-init
          git cherry-pick b0e3e24dcf0c849f54bfecec2b8ac404168ec4d4  # tests: Add VM cloud-init test
          git cherry-pick c1cd34cc68a5d1e98a96f8ebefa120839bcf0660  # github: Run the VM cloud-init test
          git cherry-pick aca18709cf49ce701937be6b8b12bed31b2b678e  # incusd/network/ovn: Allow changing a networks parent
          git cherry-pick dfb46a74a11d1a0718ec1f4cd4a7c3e9943ef5ad  # doc: Update OVN network parent documentation
          git cherry-pick 86da81c205a7a336ff9daa46c3bbe1684b11cbd4  # tests: Add OVN network reparenting tests
          git cherry-pick be068b08705554ccc758f3f6e1acc670d9230de9  # shared/logger: Add WarnOnErrorExcept to the Logger interface
          git cherry-pick 424c368c9df435d68a093ae94f1460e1c8b99235  # shared/resources: Fix double close of ethtool socket
          git cherry-pick 3d95f35e2d2723e8bbbb20d468a816da19e2257c  # shared/resources: Base memory usage on MemAvailable
          git cherry-pick 4d84a749fe9c4b362a1992c5dfdb6db7bc9df8a9  # client: Drop the context-free VM agent connection debug line
          git cherry-pick 83a756379d973046d8c477c3358ced411f769a76  # incusd/cluster: Fix swapped CPU and memory usage in rebalance scoring
          git cherry-pick 5e1a776838f8a80d86c1da6d1508da7b4b4797cf  # incusd/cluster: Use the instance's project when rebalancing
          git cherry-pick 733e81c782636a9dcfc48f46ca254e294e47a4c9  # incusd/instance: Log placement scriptlet refusals
          git cherry-pick 7cabd630269ce4398ccfc30555a881751aab37d3  # incusd/instance: Only warn on unexpected metrics and state query errors
          git cherry-pick 68ea53ac37042813a16efdbfbb3a951b0858470a  # incusd/instance: Remove devices before deleting the instance volume
          git cherry-pick f7ddb60fc4f720722bb098057a264413ca96de6a  # incusd/instance: Fix error messages altered by variable rename
          git cherry-pick 8c4b20d382e350de767068da25c14037007a5065  # incusd/device/nic: Only warn on MTU lookup failures for existing host interfaces
          git cherry-pick 9df03594c580599af581a28dcd844739a6548daa  # incusd/storage: Don't fail UnmountInstance on a volume still in use
          git cherry-pick 0c75111f151a9993cf624575db7c51d212e94400  # incusd/storage/zfs: Tolerate deleted datasets when filling the property cache
          git cherry-pick 3c92fe9c10d2d38018d9b1db46af97d411c8c54a  # incusd/images: Don't ignore move errors when importing a split image from a member
          git cherry-pick 7e8e810e9973e6cdba7829beed284d59e1b9bf56  # incusd/images: Keep expired cached image files still used by other projects
          git cherry-pick 0507ea02e59cda53de73747929b283c4b1b46718  # incusd/images: Return not found when exporting an image whose file is missing
          git cherry-pick 1a83c0637db95dfa655049b10a2bb4265060e635  # incusd/auth/openfga: Tolerate tuple conflicts during resource sync
          git cherry-pick 253f39a7b625b0e76e65f375a5a6a6203af9a06f  # incusd/auth/openfga: Read tuples page by page when syncing resources
          git cherry-pick 8f5150e66770bbc7e876a48e38a23432508f0160  # doc/clustering: Document member count, latency and clock requirements
          git cherry-pick 14923203246d2a7659c32927802a5f38437d957c  # incusd/network/ovn: Restrict the IC southbound monitor to used tables
          git cherry-pick 6f410f7ed4369180ee1aff6c0ba0e8e8435494cf  # incusd/storage/zfs: Only list snapshots when a snapshot is queried
          git cherry-pick dc6983f4a0255fecf0dbbce05525f23912c7f72b  # incusd/storage/zfs: Wait for snapshot device removal on unmount
          git cherry-pick 2e77303e4893f1323b2e17d06b3d2891c5c95eeb  # incusd/apparmor: Don't allow reading everything when LD_LIBRARY_PATH is unset
          git cherry-pick 51357bbf44d62a3a1da7c783b8c9f936d2626ec0  # incusd/network: Fix OVN network creation retries
          git cherry-pick d6af65474ec6a3c7a4d279d0f78036626073e91a  # tests: Cover clustered OVN network creation retries
          git cherry-pick c311b7a7f5fe2fa493dcde411f6bc4cd5d975cd1  # github: Run the OVN cluster retry test
          git cherry-pick 1b27ad53adddbecb47f2a72696c2a1e5b62ca737  # internal/server/instance/driver/qemu: use hashed block node name when resizing
          git cherry-pick 76b37df3e17c1e8f4af96c2a9d4921b228544cfb  # shared/subprocess: Write pid files atomically
          git cherry-pick 5472f997327b4c991a821f37ebaf004bc32e6850  # shared/subprocess: Only signal the process that was recorded
          git cherry-pick 80774bd96b31737acf35b1bf6d1bb8592ba33a67  # incusd/dnsmasq: Remove pid file after killing dnsmasq
          git cherry-pick 4928a7876638137df0714ea0e7ebba69673e4019  # incusd/network: Use network config to detect dnsmasq use
          git cherry-pick 8904b9f479fe5459d536a392f7ced209dad528d8  # tests: Check stale dnsmasq.pid never signals other processes
          git cherry-pick 4d8ada58924e08a890041942c2786a4d5c4b7f82  # incusd/instance: Add HashName
          git cherry-pick dc1529d1cbd1c51f036bc6d924889a26233fdb68  # incusd/instance/qemu: Use instance.HashName
          git cherry-pick 893028ae3f2e38d176e1102bbe641ce89433d8c0  # incus-agent: Hash long virtiofs mount tags on hotplug
          git cherry-pick e82bfc8a435fbf3e35e6bf28dde34f24ad8dde07  # incusd/auth/openfga: Don't hold online lock during requests
          git cherry-pick 4917c599b91143a534d10596dc1dcc346f1675e0  # incusd/auth/openfga: Return offline error from GetPermissionChecker
          git cherry-pick acce045e6fe6dd5bd92a362941dc2fdfc11e3dfb  # incusd/instance/agent-loader: Make macOS agent drive non-browsable
          git cherry-pick b5995fcb33eab55ef1ebb4653b8f8b0a9243f4d9  # tests: Fix race in OVN reparenting test
          git cherry-pick bdc2855505d79d07cce692520b0f6faa178b8a18  # incusd/device: Add DiskVMVirtiofsSupported
          git cherry-pick a0edce929fd25f952ad65606d0f49a33d0d9b996  # incusd/instance/qemu: Use non-shared memory when virtiofs isn't wanted
          git cherry-pick 5ded9cf688a7e48a58a4497d627a51a9032292ff  # incusd/instance: Document the memory allocation of nested virtual machines
