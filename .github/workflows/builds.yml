          git cherry-pick 372818c855b59a943fa5e67c0ab237f070a7a4af  # incusd/instance/drivers: Add support for cross-cluster dependent volumes migration
          git cherry-pick c25590ea55115ae7a1cb8f663963919dec4dc1d9  # incusd/storage: Add support for cross-cluster dependent volumes migration
          git cherry-pick a223c01b8ff6f2c218d76aaabd300888d23c0a3f  # incusd/instance: Add HasDependentDisk and ForEachDependentDiskType to instance interface
          git cherry-pick 43d86bef5f7e9a9ac60f5f29348e9caac2af3b57  # incusd/storage: use ForEachDependentDiskType and HasDependentDisk from instance
