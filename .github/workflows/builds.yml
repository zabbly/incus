          git cherry-pick fa3a8d4ddc93e880712dd86794f4257cd005393d  # incusd/storage: Switch to go-yaml/v4
          git cherry-pick 39a18a73b30299ca7cfc0ea2486e728bfa0363c0  # incus-agent: Switch to go-yaml/v4
          git cherry-pick 7a8c6aea461ef67b72307d9eb33671d375a40623  # incus-migrate: Switch to go-yaml/v4
