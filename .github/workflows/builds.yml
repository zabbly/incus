              bg env GOARCH=amd64 GOOS=netbsd CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.netbsd.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent

              bg env GOARCH=amd64 CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.linux.x86_64" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent
              bg env GOARCH=386 CGO_ENABLED=0 go build -o "/opt/incus/agent/incus-agent.linux.i686" -tags=agent,netgo github.com/lxc/incus/v7/cmd/incus-agent

